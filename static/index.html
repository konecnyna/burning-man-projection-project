<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlantis Hand Tracking Program</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --pipboy-green: #00ff41;
      --pipboy-green-dark: #00dd33;
      --pipboy-orange: rgb(255, 170, 60);
      --pipboy-orange-glow: rgba(255, 170, 60, 0.5);
    }

    body {
      font-family: 'Arial', sans-serif;
      background: #000;
      color: white;
      overflow: hidden;
      height: 100vh;
    }

    .app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .scene-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }

    .scene-container.active {
      opacity: 1;
    }

    .scene-container.transitioning {
      opacity: 0.5;
    }

    .parent-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 17, 0, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      font-family: 'Share Tech Mono', monospace;
    }

    .parent-overlay.visible {
      opacity: 1;
      visibility: visible;
    }

    .overlay-content {
      text-align: center;
      max-width: 600px;
      background: #001100;
      border: 3px solid #00ff41;
      border-radius: 10px;
      box-shadow:
        0 0 30px rgba(0, 255, 65, 0.5),
        inset 0 0 30px rgba(0, 255, 65, 0.1);
      padding: 40px;
      position: relative;
    }

    .overlay-content h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: #00ff41;
      text-shadow: 0 0 20px #00ff41;
      font-weight: bold;
    }

    .overlay-content p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      color: #00dd33;
      opacity: 0.9;
    }

    .scene-progress {
      width: 100%;
      height: 4px;
      background: rgba(0, 255, 65, 0.2);
      border: 1px solid #00ff41;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 1rem;
      box-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
    }

    .scene-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #00ff41, #00dd33);
      border-radius: 2px;
      transition: width 0.3s ease;
      box-shadow: 0 0 10px #00ff41;
    }

    .scene-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      color: #00ff41;
      text-shadow: 0 0 5px #00ff41;
    }

    .scene-counter {
      font-size: 1rem;
      opacity: 0.8;
      color: #00ff41;
    }

    .scene-timer {
      font-size: 1rem;
      opacity: 0.8;
      color: #00ff41;
    }

    .hand-cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      background: #00ff88;
      border-radius: 50%;
      box-shadow: 0 0 20px #00ff88;
      transition: all 0.1s ease;
      transform: translate(-50%, -50%);
      z-index: 100;
      pointer-events: none;
    }

    .hand-cursor.hand-0 {
      background: #00ff88;
      box-shadow: 0 0 20px #00ff88;
    }

    .hand-cursor.hand-1 {
      background: #ff6b6b;
      box-shadow: 0 0 20px #ff6b6b;
    }

    .hand-cursor.hand-2 {
      background: #4ecdc4;
      box-shadow: 0 0 20px #4ecdc4;
    }

    .hand-cursor.hand-3 {
      background: #ffe66d;
      box-shadow: 0 0 20px #ffe66d;
    }

    .hand-cursor.hand-4 {
      background: #a8e6cf;
      box-shadow: 0 0 20px #a8e6cf;
    }

    .hand-cursor.hand-5 {
      background: #ff8b94;
      box-shadow: 0 0 20px #ff8b94;
    }

    /* Not a bar: just a transparent frame that parks each HUD box at the
       bottom corners. A full-width opaque slab sat on top of the artwork;
       discrete translucent boxes let the scene show through. */
    .status-bar {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      z-index: 50;
      pointer-events: none;   /* audience input is camera-only */
    }

    .idle-warning {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(51, 34, 0, 0.55);
      border: 1px solid rgba(255, 170, 60, 0.6);
      border-radius: 8px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow:
        0 0 16px var(--pipboy-orange-glow),
        inset 0 0 14px rgba(255, 170, 60, 0.08);
      padding: 12px 20px;
      z-index: 60;
      font-family: 'Share Tech Mono', monospace;
      color: var(--pipboy-orange);
      text-shadow: 0 0 8px var(--pipboy-orange);
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      animation: warning-pulse 1s ease-in-out infinite;
    }

    .idle-warning.visible {
      opacity: 1;
      visibility: visible;
    }

    .warning-content {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .warning-icon {
      font-size: 1.2rem;
      animation: warning-flash 0.5s ease-in-out infinite alternate;
    }

    .warning-text {
      font-size: 0.9rem;
      font-weight: bold;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: rgba(0, 17, 0, 0.42);
      border: 1px solid rgba(0, 255, 65, 0.45);
      border-radius: 8px;
      /* Frosted rather than solid, so the scene reads through the box. */
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow:
        0 0 14px rgba(0, 255, 65, 0.15),
        inset 0 0 14px rgba(0, 255, 65, 0.05);
      font-family: 'Share Tech Mono', monospace;
      color: #00ff41;
      text-shadow: 0 0 5px #00ff41;
    }

    /* The instruction is the one HUD item the audience is meant to act on, so
       it takes the middle of the strip. It yields width to the two fixed-size
       items either side rather than pushing the countdown off-screen. */
    #sceneInstructions {
      flex: 0 1 auto;
      min-width: 0;
      text-align: center;
    }

    #sceneInstructionText {
      overflow-wrap: anywhere;
    }

    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--pipboy-orange);
      box-shadow: 0 0 10px var(--pipboy-orange);
      animation: pulse 2s ease-in-out infinite;
    }

    .status-indicator.connected {
      background: var(--pipboy-orange);
      box-shadow: 0 0 10px var(--pipboy-orange);
    }

    .status-indicator.ready {
      background: var(--pipboy-green);
      box-shadow: 0 0 15px var(--pipboy-green);
      animation: ready-pulse 1.5s ease-in-out infinite;
    }

    .debug-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #001100;
      border: 2px solid #00ff41;
      border-radius: 5px;
      box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
      color: #00ff41;
      font-family: 'Share Tech Mono', monospace;
      font-weight: bold;
      text-shadow: 0 0 5px #00ff41;
      padding: 10px 15px;
      cursor: pointer;
      z-index: 100;
      transition: all 0.3s ease;
    }

    .debug-toggle:hover {
      background: rgba(0, 255, 65, 0.1);
      box-shadow: 0 0 25px rgba(0, 255, 65, 0.5);
    }

    .debug-panel {
      position: fixed;
      top: 60px;
      right: 20px;
      background: #001100;
      border: 2px solid #00ff41;
      border-radius: 10px;
      box-shadow:
        0 0 20px rgba(0, 255, 65, 0.3),
        inset 0 0 20px rgba(0, 255, 65, 0.1);
      padding: 15px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      color: #00ff41;
      text-shadow: 0 0 5px #00ff41;
      z-index: 100;
      display: none;
      max-width: 400px;
    }

    .debug-panel.visible {
      display: block;
    }

    .manual-controls {
      position: fixed;
      top: 50%;
      left: 20px;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 100;
      background: #001100;
      border: 2px solid #00ff41;
      border-radius: 10px;
      box-shadow:
        0 0 20px rgba(0, 255, 65, 0.3),
        inset 0 0 20px rgba(0, 255, 65, 0.1);
      padding: 15px;
      width: auto;
    }

    .manual-controls button {
      background: rgba(0, 255, 65, 0.1);
      border: 1px solid #00ff41;
      border-radius: 5px;
      color: #00ff41;
      font-family: 'Share Tech Mono', monospace;
      font-weight: bold;
      text-shadow: 0 0 5px #00ff41;
      padding: 10px 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      width: auto;
      white-space: nowrap;
    }

    .manual-controls button:hover {
      background: rgba(0, 255, 65, 0.2);
      box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
    }

    .debug-video {
      position: fixed;
      top: 60px;
      left: 20px;
      background: #001100;
      border: 2px solid #00ff41;
      border-radius: 10px;
      box-shadow:
        0 0 20px rgba(0, 255, 65, 0.3),
        inset 0 0 20px rgba(0, 255, 65, 0.1);
      padding: 10px;
      z-index: 100;
      display: none;
    }

    .debug-video.visible {
      display: block;
    }

    .debug-video img {
      max-width: 320px;
      max-height: 240px;
      border-radius: 8px;
    }

    .debug-control {
      margin: 5px 0;
    }

    .debug-control button {
      background: rgba(0, 255, 65, 0.1);
      border: 1px solid #00ff41;
      border-radius: 3px;
      color: #00ff41;
      font-family: 'Share Tech Mono', monospace;
      font-weight: bold;
      text-shadow: 0 0 5px #00ff41;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.3s ease;
    }

    .debug-control button:hover {
      background: rgba(0, 255, 65, 0.2);
      box-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
    }

    .debug-points {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99;
      display: none;
    }

    .debug-points.visible {
      display: block;
    }

    .debug-point-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .controls-hud-hidden .status-bar,
    .controls-hud-hidden .debug-toggle,
    .controls-hud-hidden .debug-panel,
    .controls-hud-hidden .debug-video,
    .controls-hud-hidden .manual-controls,
    .controls-hud-hidden .parent-overlay,
    .controls-hud-hidden .idle-warning,
    .controls-hud-hidden .toast-notification {
      display: none !important;
    }

    /* Production mode CSS - Hide development controls even if JS fails */
    .production-hidden {
      display: none !important;
    }

    /* Add pulse animation for pipboy style */
    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }

    @keyframes ready-pulse {

      0%,
      100% {
        opacity: 1;
        box-shadow: 0 0 15px var(--pipboy-green);
        transform: scale(1);
      }

      50% {
        opacity: 0.7;
        box-shadow: 0 0 25px var(--pipboy-green), 0 0 35px rgba(0, 255, 65, 0.3);
        transform: scale(1.1);
      }
    }

    @keyframes warning-pulse {

      0%,
      100% {
        box-shadow: 0 0 20px var(--pipboy-orange-glow), inset 0 0 15px rgba(255, 170, 60, 0.1);
      }

      50% {
        box-shadow: 0 0 30px var(--pipboy-orange-glow), 0 0 40px rgba(255, 170, 60, 0.2), inset 0 0 20px rgba(255, 170, 60, 0.2);
      }
    }

    .toast-notification {
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 51, 20, 0.55);
      border: 1px solid rgba(0, 255, 65, 0.6);
      border-radius: 8px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow:
        0 0 16px rgba(0, 255, 65, 0.35),
        inset 0 0 14px rgba(0, 255, 65, 0.08);
      padding: 12px 20px;
      z-index: 65;
      font-family: 'Share Tech Mono', monospace;
      color: var(--pipboy-green);
      text-shadow: 0 0 8px var(--pipboy-green);
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      min-width: 200px;
      text-align: center;
    }

    .toast-notification.visible {
      opacity: 1;
      visibility: visible;
      top: 20px;
    }

    .toast-content {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }

    .toast-icon {
      font-size: 1.2rem;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes warning-flash {
      0% {
        opacity: 1;
      }

      100% {
        opacity: 0.6;
      }
    }

    /* Add scanlines effect to HUD elements */
    .status-bar::before,
    .debug-panel::before,
    .manual-controls::before,
    .debug-video::before,
    .overlay-content::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(transparent 50%,
          rgba(0, 255, 65, 0.03) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 1;
    }


    /* ------------------------------------------------------------------
       Scene countdown ring — matches the onboarding "auto-start" dial in
       scenes/welcome.html so the two read as the same piece of interface.
       Number in the middle, arc sweeping down as the scene runs out.
       ------------------------------------------------------------------ */
    .countdown-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      opacity: 0.8;
    }

    .scene-countdown-dial {
      position: relative;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .scene-countdown-dial .dial-number {
      position: absolute;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--pipboy-green);
      text-shadow: 0 0 10px var(--pipboy-green);
      z-index: 1;
      line-height: 1;
    }

    .scene-countdown-dial svg {
      position: absolute;
      top: 0;
      left: 0;
      transform: rotate(-90deg);   /* start the sweep at 12 o'clock */
    }

    .scene-countdown-dial .dial-track {
      opacity: 0.25;
    }

    .scene-countdown-dial .dial-ring {
      transition: stroke-dashoffset 0.9s linear;   /* ~1 tick, so it glides */
      stroke-linecap: round;
    }

    /* Last five seconds: switch to orange and pulse, same cue the
       onboarding dial uses when it is about to fire. */
    .scene-countdown-dial.ending .dial-number,
    .scene-countdown-dial.ending .dial-ring {
      color: var(--pipboy-orange);
      stroke: var(--pipboy-orange);
      text-shadow: 0 0 12px var(--pipboy-orange);
      animation: dialPulse 1s ease-in-out infinite;
    }

    @keyframes dialPulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.55; }
    }


    /* Glitch transition overlay */
    .glitch-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.1s ease;
      pointer-events: none;
    }

    .glitch-overlay.active {
      opacity: 1;
      visibility: visible;
      animation: glitchEffect 0.8s ease-in-out;
    }

    @keyframes glitchEffect {
      0% {
        opacity: 0;
        filter: hue-rotate(0deg) saturate(1);
        transform: translateX(0);
      }

      10% {
        opacity: 1;
        filter: hue-rotate(90deg) saturate(3);
        transform: translateX(-2px);
        box-shadow: 2px 0 0 #ff0040, -2px 0 0 #00ff40;
      }

      20% {
        opacity: 0.8;
        filter: hue-rotate(180deg) saturate(2);
        transform: translateX(2px);
        box-shadow: -2px 0 0 #ff0040, 2px 0 0 #0040ff;
      }

      30% {
        opacity: 1;
        filter: hue-rotate(270deg) saturate(4);
        transform: translateX(-1px);
        box-shadow: 1px 0 0 #40ff00, -1px 0 0 #ff4000;
      }

      40% {
        opacity: 0.6;
        filter: hue-rotate(45deg) saturate(1.5);
        transform: translateX(1px);
      }

      50% {
        opacity: 1;
        filter: hue-rotate(135deg) saturate(2.5);
        transform: translateX(0);
        box-shadow: 0 0 10px #00ff41;
      }

      60% {
        opacity: 0.4;
        filter: hue-rotate(225deg) saturate(1.8);
        transform: translateX(-1px);
      }

      70% {
        opacity: 0.9;
        filter: hue-rotate(315deg) saturate(3.2);
        transform: translateX(1px);
      }

      80% {
        opacity: 0.3;
        filter: hue-rotate(60deg) saturate(1.2);
        transform: translateX(0);
      }

      90% {
        opacity: 0.7;
        filter: hue-rotate(120deg) saturate(2.8);
        transform: translateX(-0.5px);
      }

      100% {
        opacity: 0;
        filter: hue-rotate(0deg) saturate(1);
        transform: translateX(0);
      }
    }

    /* Additional glitch effects for scene container */
    .scene-container.glitching {
      animation: sceneGlitch 0.8s ease-in-out;
    }

    @keyframes sceneGlitch {

      0%,
      100% {
        transform: translateX(0);
        filter: contrast(1) brightness(1);
      }

      10% {
        transform: translateX(-2px);
        filter: contrast(1.2) brightness(1.1) hue-rotate(90deg);
      }

      20% {
        transform: translateX(2px);
        filter: contrast(0.8) brightness(0.9) hue-rotate(180deg);
      }

      30% {
        transform: translateX(-1px);
        filter: contrast(1.5) brightness(1.2) hue-rotate(270deg);
      }

      40% {
        transform: translateX(1px);
        filter: contrast(0.9) brightness(0.8) hue-rotate(45deg);
      }

      50% {
        transform: translateX(0);
        filter: contrast(1.3) brightness(1.3) hue-rotate(135deg);
      }

      60% {
        transform: translateX(-0.5px);
        filter: contrast(0.7) brightness(0.7) hue-rotate(225deg);
      }

      70% {
        transform: translateX(0.5px);
        filter: contrast(1.4) brightness(1.4) hue-rotate(315deg);
      }

      80% {
        transform: translateX(0);
        filter: contrast(1.1) brightness(1.1) hue-rotate(60deg);
      }

      90% {
        transform: translateX(-0.2px);
        filter: contrast(0.95) brightness(0.95) hue-rotate(120deg);
      }
    }

    .status-bar>*,
    .debug-panel>*,
    .manual-controls>*,
    .debug-video>*,
    .overlay-content>* {
      position: relative;
      z-index: 2;
    }
  </style>
</head>

<body>
  <!-- Absolute: this file is served at "/", so a relative path would resolve
       to /fonts/... which has no route. -->
  <link href="/static/fonts/share-tech-mono.css" rel="stylesheet">
  <div class="app-container">
    <!-- Scene containers will be dynamically created -->
    <div class="scene-container active" id="scene-container">
      <!-- Current scene content will be loaded here -->
    </div>

    <!-- Glitch transition overlay -->
    <div class="glitch-overlay" id="glitchOverlay"></div>

    <!-- Hand cursors -->
    <div class="hand-cursors" id="handCursors">
      <!-- Hand cursors will be created dynamically -->
    </div>

    <!-- ====================================================================
         AUDIENCE HUD
         These tell a visitor what is happening: which scene they are in, when
         it will change, and when the piece is about to go back to sleep.
         This is user interface, not instrumentation. The debug readouts that
         used to live alongside it (event counts, hand counts, confidence,
         video feed, debug points) are gone and should stay gone.
         ==================================================================== -->

    <!-- Scene announcement, shown briefly on each scene change -->
    <div class="parent-overlay hud-element" id="parentOverlay">
      <div class="overlay-content">
        <h1 id="overlayTitle">Loading...</h1>
        <p id="overlayDescription">Preparing interactive experience...</p>
        <div id="overlayExtraContent"></div>
      </div>
    </div>




    <!-- Persistent strip: what is playing and what is next -->
    <div class="status-bar hud-element" id="status-bar">
      <div class="status-item">
        <span id="currentScene">Portal: Loading</span>
      </div>
      <!-- How to use the scene that is playing. Persistent rather than part of
           the scene-change overlay: that overlay auto-hides after 3s, scenes run
           25-60s, and most of the audience walks up mid-scene and would never
           see it. Hidden entirely for scenes with no instructions set. -->
      <div class="status-item" id="sceneInstructions" style="display: none;">
        <span class="countdown-label">HOW TO</span>
        <span id="sceneInstructionText"></span>
      </div>

      <div class="status-item">
        <span class="countdown-label" id="sceneCountdownLabel">NEXT</span>
        <div class="scene-countdown-dial" id="sceneCountdownDial">
          <div class="dial-number" id="sceneCountdownNumber">--</div>
          <svg width="40" height="40">
            <circle class="dial-track" cx="20" cy="20" r="17" fill="none"
                    stroke="var(--pipboy-green)" stroke-width="3" />
            <circle class="dial-ring" id="sceneCountdownRing" cx="20" cy="20" r="17" fill="none"
                    stroke="var(--pipboy-green)" stroke-width="3"
                    stroke-dasharray="106.8" stroke-dashoffset="0" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Idle warning: the piece is about to go back to sleep -->
    <div class="idle-warning hud-element" id="idleWarning">
      <div class="warning-content">
        <span class="warning-icon">⚠</span>
        <span class="warning-text">No hands detected. Entering idle mode in <span
            id="idleWarningCountdown">--</span>s</span>
      </div>
    </div>

    <!-- Transient notices, e.g. "Now playing: Kaleidoscope" -->
    <div class="toast-notification hud-element" id="toastNotification">
      <div class="toast-content">
        <span class="toast-icon" id="toastIcon">✓</span>
        <span class="toast-text" id="toastText">Notification message</span>
      </div>
    </div>
  </div>

  <script src="/static/socket.io.js"></script>
  <script>
    // ============================================================================
    // APPLICATION STATE - Global state container (similar to Android Application)
    // ============================================================================
    class ApplicationState {
      constructor() {
        this.state = {
          // Core application state
          isConnected: false,
          confidence: 0,
          eventCount: 0,

          // Mode state
          currentMode: 'idle', // idle, onboarding, active, transitioning
          previousMode: null,
          modeStartTime: Date.now(),

          // Session state
          sessionActive: false,
          sessionStartTime: null,
          welcomeShownThisSession: false,

          // Hand tracking state
          hands: [],
          handsDetected: false,
          lastHandDetectedTime: null,

          // Scene state
          currentScene: null,
          sceneStartTime: null,
          sceneIndex: 0,
          totalScenes: 0,

          // Idle management
          idleTimeoutMs: 45_000,
          idleTimeoutStartTime: null,

          // Debug state
        };

        this.listeners = new Map();
      }

      // Get current state (read-only)
      getState() {
        return { ...this.state };
      }

      // Get specific state value
      get(key) {
        return this.state[key];
      }

      // Update state and notify listeners
      // Called ~4x per frame on the hand-tracking path, so it stays lean:
      // one shallow clone for the previous value, no history buffer. A
      // stateHistory used to be recorded here and never read by anything.
      setState(updates) {
        const oldState = { ...this.state };
        this.state = { ...this.state, ...updates };

        // Notify listeners
        Object.keys(updates).forEach(key => {
          if (this.listeners.has(key)) {
            this.listeners.get(key).forEach(callback => {
              callback(this.state[key], oldState[key], this.state);
            });
          }
        });

        // Notify global listeners
        if (this.listeners.has('*')) {
          this.listeners.get('*').forEach(callback => {
            callback(this.state, oldState, updates);
          });
        }
      }

      // Subscribe to state changes
      subscribe(key, callback) {
        if (!this.listeners.has(key)) {
          this.listeners.set(key, []);
        }
        this.listeners.get(key).push(callback);

        // Return unsubscribe function
        return () => {
          const callbacks = this.listeners.get(key);
          if (callbacks) {
            const index = callbacks.indexOf(callback);
            if (index > -1) {
              callbacks.splice(index, 1);
            }
          }
        };
      }

      // Reset state to initial values
      reset() {
        this.setState({
          currentMode: 'idle',
          previousMode: null,
          modeStartTime: Date.now(),
          sessionActive: false,
          sessionStartTime: null,
          welcomeShownThisSession: false,
          hands: [],
          handsDetected: false,
          lastHandDetectedTime: null,
          currentScene: null,
          sceneStartTime: null,
          sceneIndex: 0,
          idleTimeoutStartTime: null
        });
      }
    }

    // ============================================================================
    // HUD MANAGER - Centralized HUD visibility management
    // ============================================================================
    // ============================================================================
    // HUD — audience-facing interface
    //
    // Tells a visitor what is happening: which scene is playing, when it will
    // change, and when the piece is about to return to idle. This is UI, not
    // instrumentation; the old debug readouts are deliberately not here.
    //
    // Visibility is per-mode: shown in active only. Idle is the screensaver and
    // should be clean, and onboarding draws its own terminal chrome -- the
    // scene bar and countdown on top of that read as two competing interfaces.
    // ============================================================================
    class HUDManager {
      constructor(appState) {
        this.appState = appState;
        this.overlayTimer = null;
      }

      show() {
        document.querySelectorAll('.hud-element').forEach(el => { el.style.display = ''; });
      }

      hide() {
        document.querySelectorAll('.hud-element').forEach(el => { el.style.display = 'none'; });
      }

      hideForMode() { this.hide(); }

      showForMode(mode) {
        // Idle is the screensaver and onboarding is a full-screen terminal that
        // brings its own status row; neither wants the parent HUD over it.
        if (mode === 'idle' || mode === 'onboarding') this.hide(); else this.show();
      }


      // Scene announcement. Auto-hides so it never sits on top of the artwork.
      showOverlay(title, description, extraContent) {
        const overlay = document.getElementById('parentOverlay');
        if (!overlay) return;

        const t = document.getElementById('overlayTitle');
        const d = document.getElementById('overlayDescription');
        const x = document.getElementById('overlayExtraContent');

        if (t && title) t.textContent = title;
        if (d) d.textContent = description || '';
        if (x) x.innerHTML = extraContent || '';

        overlay.classList.add('visible');

        if (this.overlayTimer) clearTimeout(this.overlayTimer);
        this.overlayTimer = setTimeout(() => this.hideOverlay(), 3000);
      }

      hideOverlay() {
        const overlay = document.getElementById('parentOverlay');
        if (overlay) overlay.classList.remove('visible');
        if (this.overlayTimer) {
          clearTimeout(this.overlayTimer);
          this.overlayTimer = null;
        }
      }
    }

    class ModeManager {
      constructor(appState, loadSceneCallback = null) {
        this.appState = appState;
        this.loadSceneCallback = loadSceneCallback;
        this.hudManager = new HUDManager(appState);
        this.idleTimer = null;
        this.idleWarningTimer = null;
        this.idleWarningVisible = false;
        this.idleHandConfidenceDetectionLevel = .75

        // Scene definitions for mode-specific scenes
        this.idleScene = {
          id: 'idle',
          name: 'Idle Screen',
          description: 'Screensaver mode - show hands to begin',
          duration: 0,
          html_file: 'scenes/idle.html',
          background_color: '#000000'
        };

        this.onboardingScene = {
          id: 'onboarding',
          name: 'Welcome & Instructions',
          description: 'Interactive welcome and instructions',
          duration: 0,
          html_file: 'scenes/welcome.html',
          background_color: '#1e3c72'
        };

        // Mode definitions
        this.modes = {
          idle: {
            name: 'Idle',
            allowTransitions: ['onboarding'],
            onEnter: () => this.onEnterIdle(),
            onExit: () => this.onExitIdle()
          },
          onboarding: {
            name: 'Onboarding',
            allowTransitions: ['active', 'idle'],
            onEnter: () => this.onEnterOnboarding(),
            onExit: () => this.onExitOnboarding()
          },
          active: {
            name: 'Active',
            allowTransitions: ['idle'],
            onEnter: () => this.onEnterActive(),
            onExit: () => this.onExitActive()
          },
          transitioning: {
            name: 'Transitioning',
            allowTransitions: ['idle', 'onboarding', 'active'],
            onEnter: () => this.onEnterTransitioning(),
            onExit: () => this.onExitTransitioning()
          }
        };

        // Subscribe to hand tracking events
        this.appState.subscribe('hands', (hands) => this.onHandsChanged(hands));

        // Initialize the current mode (trigger initial mode entry)
        this.initializeCurrentMode();
      }

      // Initialize the current mode by triggering its enter handler
      initializeCurrentMode() {
        const currentMode = this.appState.get('currentMode');
        this.transitionTo(currentMode);

        const modeConfig = this.modes[currentMode];
        if (modeConfig && modeConfig.onEnter) {
          modeConfig.onEnter();
        }
      }

      // Transition to a new mode
      transitionTo(newMode) {
        const currentMode = this.appState.get('currentMode');
        if (currentMode === newMode) {
          return;
        }

        switch (newMode) {

        }

        // Check if transition is allowed
        if (!this.modes[currentMode].allowTransitions.includes(newMode)) {
          console.warn(`[ModeManager] Invalid transition from ${currentMode} to ${newMode}`);
          return;
        }


        // Trigger glitch transition effect
        this.triggerGlitchTransition(() => {
          // Exit current mode
          if (this.modes[currentMode].onExit) {
            this.modes[currentMode].onExit();
          }

          // Update state
          this.appState.setState({
            previousMode: currentMode,
            currentMode: newMode,
            modeStartTime: Date.now()
          });

          // Enter new mode
          if (this.modes[newMode].onEnter) {
            this.modes[newMode].onEnter();
          }
        });
      }

      // Trigger glitch transition animation
      triggerGlitchTransition(callback) {
        const glitchOverlay = document.getElementById('glitchOverlay');
        const sceneContainer = document.getElementById('scene-container');

        if (glitchOverlay && sceneContainer) {
          // Start glitch effects
          glitchOverlay.classList.add('active');
          sceneContainer.classList.add('glitching');

          // Execute transition in the middle of the glitch
          setTimeout(() => {
            if (callback) callback();
          }, 400); // Middle of 0.8s animation

          // Clean up glitch effects
          setTimeout(() => {
            glitchOverlay.classList.remove('active');
            sceneContainer.classList.remove('glitching');
          }, 800); // Full animation duration
        } else {
          // Fallback if elements not found
          if (callback) callback();
        }
      }

      // Handle hand detection changes
      onHandsChanged(hands) {
        const wasDetected = this.appState.get('handsDetected');

        // Filter out low-confidence hands before determining detection state
        
        const highConfidenceHands = hands.filter(hand => hand.confidence.overall >= this.idleHandConfidenceDetectionLevel);
        const nowDetected = highConfidenceHands.length > 0;

        // Reset idle timer whenever hands are present (continuous tracking)
        if (nowDetected) {
          const currentMode = this.appState.get('currentMode');
          if (currentMode === 'active' || currentMode === 'onboarding') {
            this.resetIdleTimer();
          }
        }

        // Only update detection-related state, not hands array to avoid recursion
        if (wasDetected !== nowDetected) {
          this.appState.setState({
            handsDetected: nowDetected,
            lastHandDetectedTime: nowDetected ? Date.now() : this.appState.get('lastHandDetectedTime')
          });
          this.onHandDetectionChanged(nowDetected);
        }
      }

      onHandDetectionChanged(detected) {
        const currentMode = this.appState.get('currentMode');

        if (detected) {
          // Hand detected - handle mode transitions
          if (currentMode === 'idle') {
            this.transitionTo('onboarding');
          } else if (currentMode === 'active') {
            this.resetIdleTimer();
          } else if (currentMode === 'onboarding') {
            this.resetIdleTimer();
          }
          this.hideIdleWarning();
        } else {
          // Hand lost - start idle timer if in active or onboarding mode
          if (currentMode === 'active') {
            this.startIdleTimer();
          } else if (currentMode === 'onboarding') {
            this.startIdleTimer();
          }
        }
      }

      // Mode enter/exit handlers
      onEnterIdle() {
        this.hudManager.hideForMode('idle');
        this.clearIdleTimer();
        this.hideIdleWarning();

        this.appState.setState({
          sessionActive: false,
          sessionStartTime: null,
          welcomeShownThisSession: false
        });

        // Load idle scene
        if (this.loadSceneCallback) {
          this.loadSceneCallback(this.idleScene);
        }
      }

      onExitIdle() {
      }

      onEnterOnboarding() {
        // Onboarding runs its own chrome; the parent HUD stays down for it.
        this.hudManager.hide();
        this.clearIdleTimer();
        this.hideIdleWarning();

        this.appState.setState({
          sessionActive: true,
          sessionStartTime: Date.now(),
          welcomeShownThisSession: true
        });


        // Load onboarding scene
        if (this.loadSceneCallback) {
          this.loadSceneCallback(this.onboardingScene);
        }
      }

      onExitOnboarding() {

        // Show HUD when exiting onboarding mode
        const appContainer = document.querySelector('.app-container');
      }

      onEnterActive() {
        this.hudManager.showForMode('active');
        this.startIdleTimer();
      }

      onExitActive() {
        this.clearIdleTimer();
        this.hideIdleWarning();
      }

      onEnterTransitioning() {
      }

      onExitTransitioning() {
      }

      // Complete onboarding and move to active mode
      completeOnboarding() {
        if (this.appState.get('currentMode') === 'onboarding') {
          this.transitionTo('active');
        }
      }

      // Idle timer management
      startIdleTimer() {
        this.clearIdleTimer();

        const idleTimeoutMs = this.appState.get('idleTimeoutMs');
        this.appState.setState({ idleTimeoutStartTime: Date.now() });


        this.idleTimer = setTimeout(() => {
          this.transitionTo('idle');
        }, idleTimeoutMs);

        // Start warning timer (show warning 5 seconds before timeout)
        const warningTimeMs = Math.max(0, idleTimeoutMs - 5000);
        this.idleWarningTimer = setTimeout(() => {
          this.showIdleWarning();
        }, warningTimeMs);
      }

      resetIdleTimer() {
        const currentMode = this.appState.get('currentMode');
        if (currentMode === 'active' || currentMode === 'onboarding') {
          this.startIdleTimer();
        }
      }

      clearIdleTimer() {
        if (this.idleTimer) {
          clearTimeout(this.idleTimer);
          this.idleTimer = null;
        }
        if (this.idleWarningTimer) {
          clearTimeout(this.idleWarningTimer);
          this.idleWarningTimer = null;
        }
        this.appState.setState({ idleTimeoutStartTime: null });
      }

      // Idle warning management
      showIdleWarning() {
        if (!this.idleWarningVisible) {
          const idleWarning = document.getElementById('idleWarning');
          if (idleWarning) {
            idleWarning.classList.add('visible');
            this.idleWarningVisible = true;
            this.updateIdleWarningCountdown();
          }
        }
      }

      hideIdleWarning() {
        if (this.idleWarningVisible) {
          const idleWarning = document.getElementById('idleWarning');
          if (idleWarning) {
            idleWarning.classList.remove('visible');
            this.idleWarningVisible = false;
          }
        }
      }

      updateIdleWarningCountdown() {
        if (!this.idleWarningVisible) return;

        const idleTimeoutStartTime = this.appState.get('idleTimeoutStartTime');
        const idleTimeoutMs = this.appState.get('idleTimeoutMs');

        if (idleTimeoutStartTime) {
          const elapsed = Date.now() - idleTimeoutStartTime;
          const remaining = Math.max(0, (idleTimeoutMs - elapsed) / 1000);

          const warningCountdown = document.getElementById('idleWarningCountdown');
          if (warningCountdown) {
            warningCountdown.textContent = Math.ceil(remaining);
          }

          if (remaining > 0) {
            setTimeout(() => this.updateIdleWarningCountdown(), 100);
          }
        }
      }

      // Get current mode info
      getCurrentMode() {
        return this.appState.get('currentMode');
      }

      // Check if in specific mode
      isIdle() {
        return this.getCurrentMode() === 'idle';
      }

      isOnboarding() {
        return this.getCurrentMode() === 'onboarding';
      }

      isActive() {
        return this.getCurrentMode() === 'active';
      }

    }

    // ============================================================================
    // SCENE MANAGER - Handles scene lifecycle and transitions
    // ============================================================================
    class SceneManager {
      constructor(appState, modeManager, app) {
        this.appState = appState;
        this.modeManager = modeManager;
        this.app = app;
        this.hudManager = modeManager.hudManager;
        this.sceneHandlers = {};
        this.cycleTimer = null;
        this.countdownTimer = null;
        this.currentSceneIframe = null;
        this.shortScene = 25
        this.quickScene = 30
        this.defaultDuration = 45
        this.popularScene = 60

        // Scene configurations
        //
        // `instructions` is the audience-facing "how to use this" line in the
        // status bar. Keep it short enough to read at a glance from across a
        // dark camp, and keep it TRUE -- each one below describes what that
        // scene's code actually does with palm_center, not what it ought to do.
        // A scene with no `instructions` simply hides the HUD item.
        this.scenes = [
          {
            id: 'orbits',
            name: 'Orbits',
            description: 'An interactive flight through attractor orbits using hopalong formula',
            instructions: 'Move your hand to steer the flight',
            duration: this.popularScene,
            html_file: 'scenes/orbits/index.html',
            background_color: '#000000'
          },
          // {

          //   name: 'Dong Pong',
          //   description: 'Classic Pong game controlled by hand Y-axis movement',
          //   duration: this.popularScene,
          //   html_file: 'scenes/pong/index.html',
          //   background_color: '#000000'
          // },
          {
            id: 'fluidsim',
            name: 'Fluid Simulation',
            description: 'WebGL fluid simulation controlled by hand movements',
            instructions: 'Sweep your hands through the colour',
            duration: this.popularScene,
            html_file: 'scenes/fluidsim/index.html',
            background_color: '#000000'
          },
          {
            id: 'cosmic_symbolism',
            name: 'Cosmic Symbolism',
            description: 'Navigate through cosmic imagery with hand movements',
            // Reads palm_center.y straight through: y is 0 at the top of frame,
            // and maps to a wheel deltaY of -50..+50. Positive deltaY scrolls
            // forward, so a LOW hand goes forward and a HIGH hand goes back.
            // Inverted relative to what most people expect -- flipping it is a
            // one-line change in cosmic-symbolism/index.html, not a text fix.
            instructions: 'Lower your hand to fly on · raise it to go back',
            duration: this.popularScene,
            html_file: 'scenes/cosmic-symbolism/index.html',
            background_color: '#000000'
          },
            {
            id: 'tie_dye',
            name: 'Tie Dye',
            description: 'Use your hands to create a tie dye pattern',
            instructions: 'Your hand is the brush — draw in the air',
            duration: this.defaultDuration,
            html_file: 'scenes/tie-dye/index.html',
            background_color: '#000000'
          },
          {
            id: 'physarum',
            name: 'Slime Mould',
            description: 'A living network grows toward your hands and reroutes as you move',
            instructions: 'Hold your hands out — the network grows to them',
            duration: this.shortScene,
            html_file: 'scenes/physarum/index.html',
            background_color: '#000000'
          },
          // {
          //   id: 'psychedelic_waves',
          //   name: 'Psychedelic Waves',
          //   description: 'WebGL shader-based wave visualization controlled by hand movements',
          //   duration: this.quickScene,
          //   html_file: 'scenes/psychedelic-waves/index.html',
          //   background_color: '#000000'
          // },
          // {
          //   id: 'wireframe_geometry',
          //   name: 'Wireframe Geometry',
          //   description: 'Interactive morphing wireframe geometry with hand-triggered pulses',
          //   duration: this.quickScene,
          //   html_file: 'scenes/wireframe-geometry/index.html',
          //   background_color: '#000000'
          // },
          {
            id: 'kaleidoscope',
            name: 'Kaleidoscope',
            description: 'Interactive kaleidoscope with hand-controlled pattern movement',
            // Driven by frame-to-frame delta, not position: a still hand does
            // nothing at all, so the instruction has to ask for movement.
            instructions: 'Wave your hand to push the pattern',
            duration: this.popularScene,
            html_file: 'scenes/kaleidoscope/index.html',
            background_color: '#000000'
          },
          // {
          //   id: 'finger_paint',
          //   name: 'Finger Paint',
          //   description: 'Draw with your finger! Point to paint, make a fist to stop',
          //   duration: this.popularScene,
          //   html_file: 'scenes/finger-paint/index.html',
          //   background_color: '#000000'
          // },        
        ];


        // Subscribe to mode changes
        this.appState.subscribe('currentMode', (mode) => this.onModeChanged(mode));

        // Initialize scene handlers
        this.initializeSceneHandlers();

        // Handle initial mode
        this.onModeChanged(this.appState.get('currentMode'));
      }

      // Handle mode changes
      onModeChanged(mode) {

        switch (mode) {
          case 'idle':
            // Scene loading is now handled by ModeManager
            this.stopSceneCycling();
            break;
          case 'onboarding':
            // Scene loading is now handled by ModeManager
            this.stopSceneCycling();
            break;
          case 'active':
            this.startSceneCycling();
            break;
        }
      }

      // Load specific scene types - these are now handled by ModeManager
      loadIdleScene() {
        this.stopSceneCycling();
      }

      loadOnboardingScene() {
        this.stopSceneCycling();
      }

      startSceneCycling() {
        this.stopSceneCycling();

        // Start with first scene
        this.appState.setState({ sceneIndex: 0, totalScenes: this.scenes.length });
        this.loadScene(this.scenes[0]);
        this.scheduleNextScene();
      }

      stopSceneCycling() {
        if (this.cycleTimer) {
          clearTimeout(this.cycleTimer);
          this.cycleTimer = null;
        }
        if (this.countdownTimer) {
          clearInterval(this.countdownTimer);
          this.countdownTimer = null;
        }
        this._lastCountdownSecs = null;
        const number = document.getElementById('sceneCountdownNumber');
        const ring   = document.getElementById('sceneCountdownRing');
        const dial   = document.getElementById('sceneCountdownDial');
        if (number) number.textContent = '--';
        if (ring)   ring.style.strokeDashoffset = 106.8;
        if (dial)   dial.classList.remove('ending');
      }

      scheduleNextScene() {
        const currentScene = this.appState.get('currentScene');
        if (!currentScene || currentScene.duration === 0) return;

        // Clear any existing timer first
        if (this.cycleTimer) {
          clearTimeout(this.cycleTimer);
          this.cycleTimer = null;
        }

        this.cycleTimer = setTimeout(() => {
          this.nextScene();
        }, currentScene.duration * 1000);

        this.startSceneCountdown();

        // Start countdown timer
      }

      startSceneCountdown() {
        if (this.countdownTimer) clearInterval(this.countdownTimer);
        this.countdownTimer = setInterval(() => this.updateSceneCountdown(), 1000);
        this.updateSceneCountdown();
      }

      updateSceneCountdown() {
        const dial   = document.getElementById('sceneCountdownDial');
        const number = document.getElementById('sceneCountdownNumber');
        const ring   = document.getElementById('sceneCountdownRing');
        if (!dial || !number || !ring) return;

        // Circumference of the r=17 arc; must match stroke-dasharray in the markup.
        const CIRCUMFERENCE = 106.8;

        const scene = this.appState.get('currentScene');
        const startedAt = this.appState.get('sceneStartTime');

        const idle = !scene || !startedAt || scene.duration === 0 ||
                     this.modeManager.getCurrentMode() !== 'active';
        if (idle) {
          number.textContent = '--';
          ring.style.strokeDashoffset = CIRCUMFERENCE;   // empty arc
          dial.classList.remove('ending');
          return;
        }

        const elapsed = (Date.now() - startedAt) / 1000;
        const remaining = Math.max(0, scene.duration - elapsed);
        const secs      = Math.ceil(remaining);

        number.textContent = secs > 0 ? secs : 0;

        // Arc drains as the scene runs out: full at the start, empty at zero.
        const fraction = Math.min(1, Math.max(0, remaining / scene.duration));
        ring.style.strokeDashoffset = CIRCUMFERENCE * (1 - fraction);

        // Last five seconds go orange and pulse, matching the onboarding dial.
        dial.classList.toggle('ending', remaining <= 5 && remaining > 0);

        // Fire the heads-up once, on the transition into the 5s mark.
        if (secs === 5 && this._lastCountdownSecs !== 5 &&
            this.app && this.app.showToast) {
          this.app.showToast('Next scene in 5 seconds', 2500, '\u23ED');
        }
        this._lastCountdownSecs = secs;
      }

      nextScene() {
        if (this.modeManager.getCurrentMode() !== 'active') return;

        const currentIndex = this.appState.get('sceneIndex');
        const nextIndex = (currentIndex + 1) % this.scenes.length;

        this.appState.setState({ sceneIndex: nextIndex });
        this.loadScene(this.scenes[nextIndex]);
        this.scheduleNextScene();
      }

      previousScene() {
        if (this.modeManager.getCurrentMode() !== 'active') return;

        const currentIndex = this.appState.get('sceneIndex');
        const prevIndex = (currentIndex - 1 + this.scenes.length) % this.scenes.length;

        this.appState.setState({ sceneIndex: prevIndex });
        this.loadScene(this.scenes[prevIndex]);
        this.scheduleNextScene();
      }


      async loadScene(scene) {
        try {
          // Clean up previous scene
          if (this.appState.get('currentScene')) {
            this.callSceneHandler('onDestroy');
          }

          this.appState.setState({
            currentScene: scene,
            sceneStartTime: Date.now()
          });

          // Tell the audience what they are looking at.
          if (this.modeManager.getCurrentMode() === 'active') {
            const idx = this.appState.get('sceneIndex') + 1;   // 1-based for display
            const total = this.appState.get('totalScenes');
            const pct = total ? Math.round((idx / total) * 100) : 0;
            this.hudManager.showOverlay(scene.name, scene.description, `
              <div class="scene-progress">
                <div class="scene-progress-bar" style="width: ${pct}%;"></div>
              </div>
              <div class="scene-info">
                <div class="scene-counter">Content ${idx} of ${total}</div>
                <div class="scene-timer">${scene.duration}s</div>
              </div>
            `);
          }

          // Persistent "what is playing" readout.
          const sceneLabel = document.getElementById('currentScene');
          if (sceneLabel) sceneLabel.textContent = `Portal: ${scene.name || scene.id}`;

          // Persistent "how to use it" readout. Hidden outright when a scene
          // has no instructions, rather than left showing the previous scene's.
          const instructionItem = document.getElementById('sceneInstructions');
          const instructionText = document.getElementById('sceneInstructionText');
          if (instructionItem && instructionText) {
            instructionText.textContent = scene.instructions || '';
            instructionItem.style.display = scene.instructions ? '' : 'none';
          }

          const container = document.getElementById('scene-container');

          // Scenes listed here load as iframes so their <script> tags execute.
          // Anything not listed is injected with innerHTML, which does NOT run
          // scripts -- the scene renders as inert markup with no error.
          // Adding a cycling scene means adding its id to this list.
          if (['fluidsim', 'cosmic_symbolism', 'psychedelic_waves', 'tie_dye', 'orbits', 'wireframe_geometry', 'pong', 'kaleidoscope', 'finger_paint', 'physarum', 'idle'].includes(scene.id)) {
            container.innerHTML = `<iframe id="scene-iframe" src="/${scene.html_file}" style="width: 100%; height: 100%; border: none;"></iframe>`;

            setTimeout(() => {
              const iframe = document.getElementById('scene-iframe');
              if (iframe && iframe.contentWindow) {
                this.currentSceneIframe = iframe.contentWindow;
              }
            }, 1000);
          } else {
            const response = await fetch(`/${scene.html_file}`);
            if (!response.ok) {
              throw new Error(`Failed to load scene: ${response.status}`);
            }
            const html = await response.text();
            container.innerHTML = html;
            this.currentSceneIframe = null;
          }

          this.callSceneHandler('onInit');

          if (this.app && this.app.showToast &&
              this.modeManager.getCurrentMode() === 'active' && scene.duration > 0) {
            this.app.showToast(`Now playing: ${scene.name || scene.id}`, 2500, '\u{1F3A8}');
          }

        } catch (error) {
          console.error('[SceneManager] Error loading scene:', error);
        }
      }

      callSceneHandler(method, ...args) {
        const currentScene = this.appState.get('currentScene');
        if (!currentScene) return;

        // Try main app scene handlers first
        if (this.sceneHandlers[currentScene.id]) {
          const handler = this.sceneHandlers[currentScene.id][method];
          if (typeof handler === 'function') {
            handler.call(this.sceneHandlers[currentScene.id], ...args);
            return;
          }
        }

        // Try iframe communication for complex scenes
        if (this.currentSceneIframe) {
          const messageType = method.replace('on', '').toLowerCase();
          let data = {};

          if (args.length > 0) {
            data = args[0];
          }

          this.currentSceneIframe.postMessage({
            type: messageType,
            data: data
          }, '*');
        }
      }

      // Initialize scene handlers
      initializeSceneHandlers() {
        // Reference to managers for handlers
        const appState = this.appState;
        const modeManager = this.modeManager;
        const sceneManager = this;

        // Idle scene handler
        this.sceneHandlers.idle = {
          onInit: function () {
          },
          onHandDetected: function (hands) {
            // Mode manager will handle transition
          },
          onHandMove: function (hands) {
            // No interaction needed
          },
          onHandLost: function () {
            // No action needed
          }
        };

        // Onboarding scene handler
        // TERMLINK boot screen drives itself; see the note on the other
        // onboarding handler. Nothing to do from the parent.
        this.sceneHandlers.onboarding = {
          onInit: function () { },
          onHandDetected: function () { },
          onHandMove: function () { },
          onHandLost: function () { },
          onCleanup: function () { }
        };
      }
    }

    // ============================================================================
    // MAIN APPLICATION CLASS (Simplified)
    // ============================================================================
    class HandTrackingKiosk {
      constructor() {
        // Initialize core managers
        this.appState = new ApplicationState();
        this.modeManager = new ModeManager(this.appState, (scene) => this.loadScene(scene));
        this.sceneManager = new SceneManager(this.appState, this.modeManager, this);

        // Socket and connection
        this.socket = io();

        // UI state

        // Subscribe to application state changes
        this.setupStateSubscriptions();

        // Initialize components
        this.initializeSocket();

        // Start in idle mode
      }

      // Setup subscriptions to state changes
      setupStateSubscriptions() {

        // Subscribe to confidence updates
        this.appState.subscribe('confidence', () => {
        });

        // Subscribe to mode changes for HUD visibility
        this.appState.subscribe('currentMode', (mode) => {
          this.updateHUDVisibility(mode);
        });
      }

      // Update HUD visibility based on mode
      updateHUDVisibility(mode) {
      }

      initializeSocket() {
        this.socket.on('connect', () => {
          this.appState.setState({ isConnected: true });

          // Subscribe only to hand tracking events (no scene events)
          const eventsToSubscribe = [
            'hand_moved', 'hand_detected', 'hand_lost', 'frame_processed', 'thumbs_up', 'thumbs_down'
          ];
          this.socket.emit('subscribe', {
            events: eventsToSubscribe
          });
        });

        this.socket.on('disconnect', () => {
          this.appState.setState({ isConnected: false });
        });

        this.socket.on('event', (event) => {
          this.handleEvent(event);
        });
      }

      handleEvent(event) {
        // Update event count
        this.appState.setState({
          eventCount: this.appState.get('eventCount') + 1
        });

        switch (event.type) {
          case 'hand_moved':
            this.processHandEvent(event.data.hands);
            this.sceneManager.callSceneHandler('onHandMove', event.data.hands);
            break;

          case 'hand_detected':
            this.processHandEvent(event.data.hands);
            this.sceneManager.callSceneHandler('onHandDetected', event.data.hands);
            break;

          case 'hand_lost':
            this.processHandEvent(event.data.hands);
            this.sceneManager.callSceneHandler('onHandLost');
            break;

          case 'frame_processed':
            // Heartbeat only. Carries hand_count and fps, no hand payload --
            // hand data arrives on hand_moved so it is sent once per frame.
            break;

          case 'thumbs_up':
            console.log('[App] Thumbs up gesture detected', event.data);
            this.sceneManager.callSceneHandler('onThumbsUp', event.data);
            break;

          case 'thumbs_down':
            console.log('[App] Thumbs down gesture detected', event.data);
            this.sceneManager.callSceneHandler('onThumbsDown', event.data);
            break;
        }

      }

      // Process hand tracking data and update state
      processHandEvent(hands) {
        // Filter out low-confidence hands to maintain consistency with idle detection
        const filteredHands = (hands || []).filter(hand => hand.confidence.overall >= .7);
        // Update hands state - this will trigger ModeManager via subscription
        this.appState.setState({ hands: filteredHands });
      }

      initializeKeyboardShortcuts() {
        // KEYBOARD SHORTCUTS
        // There is no on-screen chrome, so these are the only manual override.
        // Deliberately invisible: nothing for the audience to discover, but an
        // operator with a keyboard can still drive it.
        //   Right / N  -> next scene
        //   Left  / P  -> previous scene
        document.addEventListener('keydown', (event) => {
          if (event.metaKey || event.ctrlKey || event.altKey) return;
          switch (event.key) {
            case 'ArrowRight':
            case 'n':
            case 'N':
              event.preventDefault();
              this.sceneManager.nextScene();
              break;
            case 'ArrowLeft':
            case 'p':
            case 'P':
              event.preventDefault();
              this.sceneManager.previousScene();
              break;
          }
        });
      }

      initializeSceneHandlers() {
        // Store reference to main app for scene handlers
        const app = this;

        // Idle scene handler
        this.sceneHandlers.idle = {
          onInit: function () {
          },

          onHandDetected: function (hands) {
            // The scene manager will handle exiting idle mode via events
          },

          onHandMove: function (hands) {
            // No interaction needed in idle mode - just detect presence
          },

          onHandLost: function () {
          }
        };

        // Onboarding scene handler with hand cursor
        // Onboarding is the TERMLINK boot screen (scenes/welcome.html). It types
        // its own sequence and posts `transition_to_active` when finished, so
        // there is nothing to drive from here.
        //
        // The handler this replaces did hover detection and a hold-to-confirm
        // countdown against beginText / countdownOverlay / countdownRing /
        // instruction1-3 -- all of which live inside the iframe, where the
        // parent's getElementById cannot reach them. It had been inert.
        this.sceneHandlers.onboarding = {
          onInit: function () { },
          onHandDetected: function () { },
          onHandMove: function () { },
          onHandLost: function () { },
          onCleanup: function () { }
        };

        // Welcome scene handler (for active mode scene cycling)

        // Wireframe Geometry scene handler
        this.sceneHandlers.wireframe_geometry = {
          onInit: function () {
          },
          onHandDetected: function (hands) {
            // Forward to iframe
            if (sceneManager.currentSceneIframe) {
              sceneManager.currentSceneIframe.postMessage({
                type: 'hand_detected',
                data: { landmarks: hands }
              }, '*');
            }
          },
          onHandMove: function (hands) {
            // Forward hand movements to iframe
            if (sceneManager.currentSceneIframe && hands && hands.length > 0) {
              sceneManager.currentSceneIframe.postMessage({
                type: 'hand_move',
                data: { landmarks: hands }
              }, '*');
            }
          },
          onHandLost: function () {
            // Forward hand lost to iframe
            if (sceneManager.currentSceneIframe) {
              sceneManager.currentSceneIframe.postMessage({
                type: 'hand_lost'
              }, '*');
            }
          },
          onCleanup: function () {
          }
        };

        // Pong scene handler
        this.sceneHandlers.pong = {
          onInit: function () {
          },
          onHandDetected: function (hands) {
            // Forward to iframe
            if (sceneManager.currentSceneIframe) {
              sceneManager.currentSceneIframe.postMessage({
                type: 'hand_detected',
                data: { landmarks: hands }
              }, '*');
            }
          },
          onHandMove: function (hands) {
            // Forward hand movements to iframe
            if (sceneManager.currentSceneIframe && hands && hands.length > 0) {
              sceneManager.currentSceneIframe.postMessage({
                type: 'hand_move',
                data: { landmarks: hands }
              }, '*');
            }
          },
          onHandLost: function () {
            // Forward to iframe
            if (sceneManager.currentSceneIframe) {
              sceneManager.currentSceneIframe.postMessage({
                type: 'hand_lost',
                data: {}
              }, '*');
            }
          },
          onCleanup: function () {
          }
        };
      }

      // Transient audience notice. Auto-hides; never blocks the artwork.
      showToast(message, duration = 3000, icon = '\u2713') {
        const toast = document.getElementById('toastNotification');
        const text  = document.getElementById('toastText');
        const ic    = document.getElementById('toastIcon');
        if (!toast || !text || !ic) return;

        text.textContent = message;
        ic.textContent = icon;
        toast.classList.add('visible');

        if (this._toastTimer) clearTimeout(this._toastTimer);
        this._toastTimer = setTimeout(() => {
          toast.classList.remove('visible');
          this._toastTimer = null;
        }, duration);
      }

      async loadScene(scene) {
        try {

          // Clean up previous scene
          if (this.currentScene) {
            this.callSceneHandler('onDestroy');
          }

          const container = document.getElementById('scene-container');

          // Set current scene
          this.currentScene = scene;
          

          // Handle complete HTML page scenes as iframes
          if (scene.id === 'fluidsim' || scene.id === 'cosmic_symbolism' || scene.id === 'psychedelic_waves' || scene.id === 'tie_dye' || scene.id === 'orbits' || scene.id === 'finger_paint' || scene.id === 'idle' || scene.id === 'onboarding') {
            container.innerHTML = `<iframe id="scene-iframe" src="/${scene.html_file}" style="width: 100%; height: 100%; border: none;"></iframe>`;

            // Wait for iframe to load, then set up communication
            setTimeout(() => {
              const iframe = document.getElementById('scene-iframe');
              if (iframe && iframe.contentWindow) {
                this.currentSceneIframe = iframe.contentWindow;
              }
            }, 1000);
          } else {
            // Load HTML fragment for other scenes
            const response = await fetch(`/${scene.html_file}`);
            if (!response.ok) {
              throw new Error(`Failed to load scene: ${response.status}`);
            }
            const html = await response.text();
            container.innerHTML = html;
          }

          // Initialize scene if handler exists
          this.callSceneHandler('onInit');

        } catch (error) {
          console.error('Error loading scene:', error);
        }

      }

      callSceneHandler(method, ...args) {
        // Add safety check for currentScene
        if (!this.currentScene) {
          console.warn('[App] callSceneHandler called but currentScene is undefined');
          return;
        }

        // Delegate to SceneManager's callSceneHandler method
        if (this.sceneManager && this.sceneManager.callSceneHandler) {
          this.sceneManager.callSceneHandler(method, ...args);
        } else {
          console.warn('[App] SceneManager not available for scene handler calls');
        }
      }




      updateIdleWarning() {
        const idleWarning = document.getElementById('idleWarning');
        const warningCountdown = document.getElementById('idleWarningCountdown');

        if (this.isIdle || !this.idleTimeoutStartTime) {
          if (this.idleWarningVisible) {
            idleWarning.classList.remove('visible');
            this.idleWarningVisible = false;
          }
          return;
        }

        // Calculate time remaining until idle timeout
        const elapsed = (Date.now() - this.idleTimeoutStartTime) / 1000;
        const remaining = Math.max(0, (this.idleTimeout / 1000) - elapsed);

        // Log the countdown every second
        const remainingSeconds = Math.floor(remaining);

        if (remaining <= 5 && remaining > 0) {
          // Show warning when under 3 seconds
          if (!this.idleWarningVisible) {
            idleWarning.classList.add('visible');
            this.idleWarningVisible = true;
          }
          warningCountdown.textContent = Math.ceil(remaining);
        } else {
          // Hide warning when over 3 seconds or at 0
          if (this.idleWarningVisible) {
            idleWarning.classList.remove('visible');
            this.idleWarningVisible = false;
          }
        }
      }




      startInIdleMode() {
        console.log('[JS] Starting in idle mode');
        this.loadIdleScene();
      }

      resetIdleTimer() {
        if (this.idleTimer) {
          clearTimeout(this.idleTimer);
        }

        if (!this.isIdle) {
          this.idleTimeoutStartTime = Date.now();
          this.idleTimer = setTimeout(() => {
            this.enterIdleMode();
          }, this.idleTimeout);
        }
      }

      enterIdleMode() {
        this.mode = 'idle';
        this.idleTimeoutStartTime = null;

        // Hide idle warning
        const idleWarning = document.getElementById('idleWarning');
        if (this.idleWarningVisible) {
          idleWarning.classList.remove('visible');
          this.idleWarningVisible = false;
        }

        // Pause scene countdown
        if (this.sceneCountdownTimer) {
          clearInterval(this.sceneCountdownTimer);
          this.sceneCountdownTimer = null;
        }

        this.pauseSceneSystem();
        this.loadIdleScene();
      }


      pauseSceneSystem() {
        // Tell the backend to pause scene cycling
        if (this.socket) {
          this.socket.emit('pause_scene_cycling');
        }
      }

      restartSceneSystem() {
        // Tell the backend to restart scene cycling
        if (this.socket) {
          this.socket.emit('restart_scene_cycling');
        }
      }

      // These methods are now handled by ModeManager
      loadIdleScene() {
        this.modeManager.transitionTo('idle');
      }

      loadOnboardingScene() {
        this.modeManager.transitionTo('onboarding');
      }



      exitOnboardingMode() {
        this.mode = 'active';

        // Start the scene system after onboarding
        this.restartSceneSystem();
      }


    }

    // Global functions for manual controls

    function nextScene() {
      if (window.app && window.app.sceneManager) {
        window.app.sceneManager.nextScene();
      } else {
        console.error('[UI] SceneManager not available');
      }
    }

    function previousScene() {
      if (window.app && window.app.sceneManager) {
        window.app.sceneManager.previousScene();
      } else {
        console.error('[UI] SceneManager not available');
      }
    }


    // Global toast function




    document.addEventListener('DOMContentLoaded', () => {
      window.app = new HandTrackingKiosk();

      // Set up iframe message handling
      window.addEventListener('message', (event) => {
        if (event.data.type === 'transition_to_active') {
          // Handle transition from onboarding to active mode
          if (window.app && window.app.modeManager) {
            window.app.modeManager.transitionTo('active');
          }
        } else if (event.data.type === 'iframe_ready') {
        }
      });
    });
  </script>
