<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <title>Atlantis Kaleidoscope</title>
  <script src="/static/socket.io.js"></script>
  <style>
  body {
	overflow: hidden;
	margin: 0;
}
canvas {
	position: absolute;
}
  </style>

</head>
<body>
<!-- partial:index.partial.html -->
<canvas id="c" width="1800" height="934"></canvas>
<!-- partial -->
  <script>
  let canvas = document.getElementById("c");
let ctx = canvas.getContext("2d", { 
	alpha: false,
	desynchronized: true, // Improves performance for frequent updates
	willReadFrequently: false // Optimizes for write-only operations
});
let w = (canvas.width = window.innerWidth);
let h = (canvas.height = window.innerHeight);
let w2 = w / 2,
	h2 = h / 2;
const PI = Math.PI;
const sin = Math.sin;
const cos = Math.cos;
const tan = Math.tan;
const floor = Math.floor;
const PI2 = PI * 2;

// Performance optimizations
let lastFrameTime = 0;
const targetFPS = 60;
const frameInterval = 1000 / targetFPS;

const angle = PI / 6;
const height = 200;
const side = height * tan(angle);

let img;
let pattern;
let offset = { x: 50, y: 10 };

window.onresize = function() {
	w = canvas.width = window.innerWidth;
	h = canvas.height = window.innerHeight;
	w2 = w / 2;
	h2 = h / 2;
};
// Keep original mouse events
window.onmousemove = function(e) {
	if (img) {
		offset.x += img.width * (e.movementX / w);
		offset.y += img.height * (e.movementY / h);
	}
};

// Hand tracking variables
let lastHandPos = { x: 0.5, y: 0.5 };
let activeHandId = null;
let smoothedHandVelocity = { x: 0, y: 0 };
let handSmoothingFactor = 0.65; // Reduced smoothing for more responsiveness
let handSensitivity = 2.5; // Increased sensitivity multiplier
let minHandMovement = 0.002; // Minimum movement threshold for better sensitivity

// Setup WebSocket connection
const socket = io();

function createFallbackPattern() {
	// Create a canvas for procedural pattern
	const patternCanvas = document.createElement('canvas');
	patternCanvas.width = 256;
	patternCanvas.height = 256;
	const patternCtx = patternCanvas.getContext('2d');
	
	// Create a colorful geometric pattern
	patternCtx.fillStyle = '#000';
	patternCtx.fillRect(0, 0, 256, 256);
	
	for (let i = 0; i < 20; i++) {
		patternCtx.fillStyle = `hsl(${i * 18}, 70%, 50%)`;
		patternCtx.beginPath();
		patternCtx.arc(128 + Math.cos(i) * 50, 128 + Math.sin(i) * 50, 20, 0, PI2);
		patternCtx.fill();
	}
	
	pattern = ctx.createPattern(patternCanvas, "repeat");
	img = { width: 256, height: 256 }; // Mock img object for offset calculations
}

function setup() {
	img = new Image();
	// Randomly choose from local kaleidoscope images
	const images = [
		"/static/scenes/kaleidoscope/images/cosmic.jpg",
		"/static/scenes/kaleidoscope/images/seamless-flowers.svg", 
		"/static/scenes/kaleidoscope/images/tomorrow-today.jpg"
	];
	const randomImage = images[Math.floor(Math.random() * images.length)];
	img.src = randomImage;
	
	img.onload = function() {
		pattern = ctx.createPattern(img, "repeat");
		loop();
	};
	img.onerror = function() {
		// Fallback: create a procedural pattern if image fails to load
		createFallbackPattern();
		loop();
	};
}

function loop(currentTime) {
	// Frame rate limiting for better performance
	if (currentTime - lastFrameTime < frameInterval) {
		requestAnimationFrame(loop);
		return;
	}
	lastFrameTime = currentTime;
	
	// Use fillRect instead of clearRect for better performance
	ctx.fillStyle = '#000';
	ctx.fillRect(0, 0, w, h);

	// Pre-calculate constants outside the loop
	const a = PI / 3;
	const angles = [0, 5 * a, 2 * a, 3 * a, 4 * a, a];
	const angleOffsetX = [0, -side, side, 0, -side, side];
	const angleOffsetY = [0, 0, height, height, height, 0];

	// Optimize loop bounds calculation
	const yiBound = Math.ceil(h2 / height) + 1;
	const xiBound = Math.ceil(w2 / side) + 1;

	for (let yi = 0; yi < yiBound; yi++) {
		const y = yi * height;
		const yModulo = yi % 2;
		
		for (let xi = 0; xi < xiBound; xi++) {
			const ai = (yModulo == 0 ? xi : xi + 3) % 6;
			const x = xi * side;
			
			const baseX = w2 + x + angleOffsetX[ai];
			const baseY = h2 + y + angleOffsetY[ai];
			const angle = angles[ai];

			// Only draw if within visible bounds
			if (y < h2) {
				drawTriangle(baseX, baseY, 1, angle);
				drawTriangle(baseX, baseY, -1, angle);
			}

			if (xi != 0) {
				const mirrorX = w2 - angleOffsetX[ai] - x;
				const mirrorY = h2 + angleOffsetY[ai] + y;
				drawTriangle(mirrorX, mirrorY, 1, -angle);
				drawTriangle(mirrorX, mirrorY, -1, -angle);
			}

			if (yi != 0) {
				const upX = w2 + x + angleOffsetX[ai];
				const upY = h2 - y + angleOffsetY[ai];
				drawTriangle(upX, upY, 1, angle);
				drawTriangle(upX, upY, -1, angle);
			}

			if (yi != 0 && xi != 0) {
				const cornerX = w2 - x - angleOffsetX[ai];
				const cornerY = h2 - y + angleOffsetY[ai];
				drawTriangle(cornerX, cornerY, 1, -angle);
				drawTriangle(cornerX, cornerY, -1, -angle);
			}
		}
	}
	
	// Update pattern offset with modulo for wrapping
	const autoOffsetX = -0.3 * sin(angle / 2);
	const autoOffsetY = -0.3 * cos(angle / 2);
	
	offset.x = ((offset.x + autoOffsetX + smoothedHandVelocity.x) % img.width + img.width) % img.width;
	offset.y = ((offset.y + autoOffsetY + smoothedHandVelocity.y) % img.height + img.height) % img.height;
	
	// Gradually decay the smoothed velocity
	smoothedHandVelocity.x *= 0.95;
	smoothedHandVelocity.y *= 0.95;

	// Continue the loop
	requestAnimationFrame(loop);
}

function drawTriangle(posX, posY, scaleX, angle) {
	ctx.translate(posX, posY);
	ctx.rotate(angle);
	ctx.scale(scaleX, 1);
	ctx.translate(offset.x, offset.y);

	ctx.beginPath();
	ctx.moveTo(0 - offset.x, 0 - offset.y);
	ctx.lineTo(0 - offset.x, height - offset.y);
	ctx.lineTo(side - offset.x, height - offset.y);
	ctx.lineTo(0 - offset.x, 0 - offset.y);
	ctx.fillStyle = pattern;
	ctx.fill();

	ctx.setTransform(1, 0, 0, 1, 0, 0);
}

// Hand tracking event handlers
function handleHandTracking(hands) {
	if (!hands || hands.length === 0) {
		// Reset active hand when no hands detected
		activeHandId = null;
		return;
	}
	
	let hand = null;
	
	// Use persistent hand ID tracking with better fallback
	if (activeHandId !== null) {
		hand = hands.find(h => h.hand_id === activeHandId);
	}
	
	// If no active hand found, pick the hand with highest confidence
	if (!hand) {
		hand = hands.reduce((best, current) => {
			const currentConfidence = current.confidence?.overall || 0;
			const bestConfidence = best?.confidence?.overall || 0;
			return currentConfidence > bestConfidence ? current : best;
		}, hands[0]);
		
		if (hand) {
			activeHandId = hand.hand_id;
		}
	}
	
	if (hand && hand.palm_center && img) {
		const currentPos = {
			x: hand.palm_center.x,
			y: hand.palm_center.y
		};
		
		// Calculate movement delta
		const deltaX = currentPos.x - lastHandPos.x;
		const deltaY = currentPos.y - lastHandPos.y;
		
		// Only apply movement if above threshold (reduces jitter, improves sensitivity to real movement)
		const movementMagnitude = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
		
		if (movementMagnitude > minHandMovement) {
			// Apply enhanced sensitivity with confidence weighting
			const confidence = hand.confidence?.overall || 0.8;
			const sensitivityBoost = confidence > 0.7 ? handSensitivity : handSensitivity * 0.7;
			
			const targetVelocityX = img.width * deltaX * sensitivityBoost;
			const targetVelocityY = img.height * deltaY * sensitivityBoost;
			
			// Smooth the velocity changes with adaptive smoothing
			const adaptiveSmoothing = confidence > 0.8 ? handSmoothingFactor * 0.8 : handSmoothingFactor;
			smoothedHandVelocity.x = smoothedHandVelocity.x * adaptiveSmoothing + targetVelocityX * (1 - adaptiveSmoothing);
			smoothedHandVelocity.y = smoothedHandVelocity.y * adaptiveSmoothing + targetVelocityY * (1 - adaptiveSmoothing);
		}
		
		// Update last position
		lastHandPos = currentPos;
	}
}

// Performance throttling for hand tracking events
let lastHandTrackingUpdate = 0;
const handTrackingThrottle = 16; // ~60 FPS max processing rate

// Setup WebSocket event handlers
socket.on('connect', () => {
	socket.emit('subscribe', {
		events: ['hand_moved', 'hand_detected', 'frame_processed']
	});
});

socket.on('event', (event) => {
	const now = Date.now();
	
	// Throttle hand tracking events for better performance
	if ((event.type === 'hand_moved' || event.type === 'hand_detected' || event.type === 'frame_processed') && event.data.hands) {
		if (now - lastHandTrackingUpdate > handTrackingThrottle) {
			try {
				handleHandTracking(event.data.hands);
				lastHandTrackingUpdate = now;
			} catch (error) {
				console.error('Error processing hand tracking event:', error);
			}
		}
	}
	
	if (event.type === 'scene_changed' && event.data.scene && event.data.scene.id === 'kaleidoscope') {
		// Scene activated - could add initialization here if needed
	}
});

setup();
  </script>



</body></html>
