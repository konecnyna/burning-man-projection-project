<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLANTIS TERMLINK</title>
  <style>
    @import url('/static/fonts/fonts.css');

    :root {
      --phos: #33ff66;
      --phos-dim: #1a8a3a;
      --phos-glow: rgba(51, 255, 102, 0.55);
      --amber: rgb(255, 176, 66);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030c06;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      color: var(--phos);
    }

    /* CRT enclosure: vignette plus a heavy inset shadow for tube curvature. */
    .crt {
      position: absolute;
      inset: 0;
      padding: 6vh 7vw;
      background:
        radial-gradient(ellipse at center, rgba(12, 46, 24, 0.5) 0%, rgba(0, 0, 0, 0.92) 125%),
        #030c06;
      box-shadow: inset 0 0 20vh rgba(0, 0, 0, 0.95);
      text-shadow: 0 0 6px var(--phos-glow);
      font-size: clamp(15px, 1.7vw, 27px);
      line-height: 1.5;
      letter-spacing: 0.04em;
    }

    /* Scanlines. */
    .crt::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(to bottom,
          rgba(0, 0, 0, 0) 0px, rgba(0, 0, 0, 0) 2px,
          rgba(0, 0, 0, 0.30) 3px, rgba(0, 0, 0, 0.30) 4px);
      pointer-events: none;
      z-index: 3;
    }

    /* Refresh band drifting down the tube. */
    .crt::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 16vh;
      background: linear-gradient(to bottom,
          rgba(51, 255, 102, 0) 0%,
          rgba(51, 255, 102, 0.05) 50%,
          rgba(51, 255, 102, 0) 100%);
      animation: sweep 7s linear infinite;
      pointer-events: none;
      z-index: 2;
    }

    @keyframes sweep {
      0%   { top: -18vh; }
      100% { top: 100vh; }
    }

    /* Output builds from the bottom, so long boots scroll rather than overflow. */
    .screen {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      animation: flicker 5s infinite steps(1);
    }

    @keyframes flicker {
      0%, 95%, 100% { opacity: 1; }
      96%           { opacity: 0.84; }
      97%           { opacity: 1; }
      98%           { opacity: 0.92; }
    }

    .line { white-space: pre-wrap; }
    .dim { color: var(--phos-dim); }
    .amber { color: var(--amber); text-shadow: 0 0 8px rgba(255, 176, 66, 0.6); }
    .rule { color: var(--phos-dim); }

    .big {
      font-size: 1.6em;
      letter-spacing: 0.13em;
      line-height: 1.28;
    }

    /* The instruction that actually matters. Boxed and pulsing so it reads
       from a distance, in the dark, to someone who is not concentrating. */
    .callout {
      align-self: flex-start;
      margin: 0.35em 0;
      padding: 0.4em 0.8em;
      border: 2px solid var(--amber);
      color: var(--amber);
      text-shadow: 0 0 10px rgba(255, 176, 66, 0.85);
      box-shadow: 0 0 20px rgba(255, 176, 66, 0.35),
                  inset 0 0 16px rgba(255, 176, 66, 0.12);
      animation: pulse 1.15s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.5; }
    }

    .cursor {
      display: inline-block;
      width: 0.6em;
      height: 1.05em;
      margin-left: 0.1em;
      vertical-align: text-bottom;
      background: var(--phos);
      box-shadow: 0 0 8px var(--phos-glow);
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      0%, 49%   { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>
</head>

<body>
  <div class="crt">
    <div class="screen" id="termOut"></div>
  </div>

  <script>
  (function () {
    'use strict';

    /* =====================================================================
       ATLANTIS TERMLINK — onboarding.

       Replaces the hover-and-hold welcome screen. That flow asked people to
       find an invisible target and hold still for three seconds, which is a
       lot to ask of someone walking past in the dark. This just tells them
       what the camp is, where they are, and what to do with their hand.

       It drives its own completion: when the boot sequence finishes it posts
       `transition_to_active` to the parent, which already listens for that
       message. There is no hand tracking in here at all -- getting this far
       already required a confident hand to wake the kiosk out of idle.

       Timing is deliberately brisk, about 16 seconds end to end. Nobody reads
       a long boot log at a party. The lines that matter are the camp name, the
       address, and the palm instruction, so those get the emphasis and the
       pauses; the rest is texture that scrolls by.
       ===================================================================== */

    // NB: wrapped in an IIFE and deliberately not called `screen`.
    // `window.screen` already exists, and an element with id="screen" also
    // gets named access on window -- a top-level `const screen` can therefore
    // be a SyntaxError, which kills the whole script with no visible error.
    const out = document.getElementById('termOut');

    // type = characters revealed per tick (higher is faster).
    // pause = ms held after the line finishes. Empty text is a spacer.
    const SCRIPT = [
      { t: 'ROBCO INDUSTRIES (TM) TERMLINK PROTOCOL',            cls: 'dim',   type: 9,  pause: 200 },
      { t: 'ATLANTIS PORTAL INTERFACE  v4.20.69',                cls: 'dim',   type: 9,  pause: 300 },
      { t: '' },
      { t: 'INITIALISING OPTICAL SENSOR ........ OK',                           type: 7,  pause: 150 },
      { t: 'LOADING LANDMARK MODEL ............. OK',                           type: 7,  pause: 150 },
      { t: 'CALIBRATING LOOKING GLASS .......... OK',                           type: 7,  pause: 150 },
      { t: 'PORTAL SUBSYSTEM ............... ONLINE',                           type: 7,  pause: 400 },
      { t: '' },
      { t: '==================================================', cls: 'rule',  type: 50, pause: 100 },
      { t: 'CAMP ATLANTIS',                                      cls: 'big amber', type: 4, pause: 560 },
      { t: 'PORTAL ADDRESS   4:30 & B',                          cls: 'big',   type: 5,  pause: 520 },
      { t: '==================================================', cls: 'rule',  type: 50, pause: 240 },
      { t: '' },
      { t: 'LOGGED IN AS ...... SYSADMIN',                                      type: 7,  pause: 180 },
      { t: 'CLEARANCE ......... DR. BOOM BOOM, PhD',                            type: 7,  pause: 180 },
      { t: 'STATUS ............ UNRESTRICTED',                    cls: 'amber', type: 7,  pause: 500 },
      { t: '' },
      { t: 'You have control of the portal.',                                   type: 13, pause: 400 },
      { t: '' },
      { t: 'SHOW YOUR PALM TO THE LOOKING GLASS',                cls: 'callout big', type: 4, pause: 950 },
      { t: '' },
      { t: 'The portal transports you every 30 seconds.',                       type: 15, pause: 700 },
      { t: 'Move your hands. See what answers.',                 cls: 'amber', type: 15, pause: 1200 },
    ];

    let cursorEl = null;

    function moveCursorTo(el) {
      if (cursorEl) cursorEl.remove();
      cursorEl = document.createElement('span');
      cursorEl.className = 'cursor';
      el.appendChild(cursorEl);
    }

    // Bound the DOM. This scene is short, but the kiosk runs for days and the
    // onboarding replays every time somebody walks up.
    function trimHistory() {
      while (out.children.length > 26) out.removeChild(out.firstChild);
    }

    function typeLine(spec) {
      return new Promise(resolve => {
        const el = document.createElement('div');
        el.className = 'line ' + (spec.cls || '');
        out.appendChild(el);
        trimHistory();

        if (!spec.t) { resolve(); return; }   // spacer

        const text = spec.t;
        const step = spec.type || 8;
        let i = 0;
        moveCursorTo(el);

        const tick = setInterval(() => {
          i = Math.min(text.length, i + step);
          el.textContent = text.slice(0, i);
          moveCursorTo(el);
          if (i >= text.length) {
            clearInterval(tick);
            setTimeout(resolve, spec.pause || 120);
          }
        }, 28);
      });
    }

    async function run() {
      for (const spec of SCRIPT) await typeLine(spec);
      if (cursorEl) cursorEl.remove();

      // Hand over to the scene cycle.
      try {
        window.parent.postMessage({ type: 'transition_to_active' }, '*');
      } catch (err) {
        console.error('[termlink] could not signal the parent frame:', err);
      }
    }

    run();
  })();
  </script>
</body>

</html>
