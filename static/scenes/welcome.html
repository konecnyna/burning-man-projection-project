<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLANTIS TERMLINK</title>
  <style>
    @import url('/static/fonts/fonts.css');

    :root {
      --phos: #33ff66;
      --phos-dim: #1a8a3a;
      --phos-glow: rgba(51, 255, 102, 0.55);
      --amber: rgb(255, 176, 66);
      --amber-glow: rgba(255, 176, 66, 0.55);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030c06;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      color: var(--phos);
    }

    /* CRT enclosure. */
    .crt {
      position: absolute;
      inset: 0;
      padding: 5vh 6vw;
      background:
        radial-gradient(ellipse at center, rgba(12, 46, 24, 0.5) 0%, rgba(0, 0, 0, 0.92) 125%),
        #030c06;
      box-shadow: inset 0 0 20vh rgba(0, 0, 0, 0.95);
      text-shadow: 0 0 6px var(--phos-glow);
      /* Sized for a 140" projection. At 1080p a 1vw line is ~1.2 inches tall
         on that screen, so the shell/loader text sits around 2 inches -- big
         enough to read as texture from across a camp, small enough that a
         dozen lines still fit. The instruction panel scales up much further
         below; it is the only part anyone has to actually read. */
      font-size: clamp(18px, 1.9vw, 38px);
      line-height: 1.45;
      letter-spacing: 0.03em;
    }

    .crt::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(to bottom,
          rgba(0, 0, 0, 0) 0px, rgba(0, 0, 0, 0) 2px,
          rgba(0, 0, 0, 0.30) 3px, rgba(0, 0, 0, 0.30) 4px);
      pointer-events: none;
      z-index: 3;
    }

    /* Soft wash: tall enough that some of it is always on screen. */
    .crt::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 55vh;
      background: linear-gradient(to bottom,
          rgba(51, 255, 102, 0) 0%,
          rgba(51, 255, 102, 0.055) 50%,
          rgba(51, 255, 102, 0) 100%);
      animation: wash 6s linear infinite;
      pointer-events: none;
      z-index: 2;
    }

    @keyframes wash {
      0%   { top: -55vh; }
      100% { top: 100vh; }
    }

    /* Telescan: a thin bright line crossing the whole glass, faster than the
       wash so the two never sync into a single pulse. Covers the full width and
       runs over every act, including after the program takes the screen. */
    .telescan {
      position: absolute;
      left: 0; right: 0;
      height: 2.5vh;
      background: linear-gradient(to bottom,
          rgba(51, 255, 102, 0) 0%,
          rgba(120, 255, 170, 0.14) 45%,
          rgba(180, 255, 210, 0.22) 50%,
          rgba(120, 255, 170, 0.14) 55%,
          rgba(51, 255, 102, 0) 100%);
      box-shadow: 0 0 6vh rgba(51, 255, 102, 0.10);
      animation: telescan 3.4s linear infinite;
      pointer-events: none;
      z-index: 4;
    }

    @keyframes telescan {
      0%   { top: -3vh; }
      100% { top: 100vh; }
    }

    .screen {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;   /* shell output grows upward */
      overflow: hidden;
      /* No opacity flicker here. A 5s steps(1) dip read as the projector
         glitching rather than as CRT character -- at 140" any whole-screen
         brightness jump looks like a fault. The life in this screen comes from
         the scan layers instead, which move continuously and never blank
         anything. */
    }

    /* Once the binary takes over it owns the screen. Centred and much larger:
       at this point the audience is being asked to do something, from a
       distance, probably in the dark, probably not concentrating. */
    .screen.app {
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 1.5em;
    }

    .line { white-space: pre-wrap; }
    .dim { color: var(--phos-dim); }
    .amber { color: var(--amber); text-shadow: 0 0 8px var(--amber-glow); }
    .bright { color: #b6ffcf; text-shadow: 0 0 10px var(--phos-glow); }
    .spacer { height: 0.75em; }

    /* CSS border rather than box-drawing characters: fixed-width ASCII art
       wraps and falls apart the moment the type gets big or the projector is
       an odd aspect. */
    .title {
      color: var(--amber);
      text-shadow: 0 0 18px var(--amber-glow);
      font-size: 2.1em;
      letter-spacing: 0.34em;
      line-height: 1.1;
    }

    .subtitle {
      color: var(--phos);
      font-size: 0.95em;
      letter-spacing: 0.26em;
      margin-top: 0.35em;
      padding-bottom: 0.55em;
      border-bottom: 2px solid var(--phos-dim);
    }


    /* One idea per line, generous spacing, nothing to parse. */
    .beat {
      color: var(--phos);
      font-size: 1.06em;
      letter-spacing: 0.12em;
      margin-top: 0.55em;
      opacity: 0;
      animation: fadein 0.7s ease forwards;
    }

    .beat .q { color: var(--phos-dim); }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(0.35em); }
      to   { opacity: 1; transform: none; }
    }

    /* The one instruction that has to survive being read at a glance. */
    .hero {
      margin: 0.85em 0 0.35em 0;
      padding: 0.5em 1.1em;
      border: 3px solid var(--amber);
      color: var(--amber);
      font-size: 1.85em;
      letter-spacing: 0.14em;
      line-height: 1.2;
      text-shadow: 0 0 10px var(--amber-glow);
      box-shadow: 0 0 20px rgba(255, 176, 66, 0.32),
                  inset 0 0 16px rgba(255, 176, 66, 0.1);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.52; }
    }

    .cursor {
      display: inline-block;
      width: 0.58em;
      height: 1.02em;
      margin-left: 0.08em;
      vertical-align: text-bottom;
      background: var(--phos);
      box-shadow: 0 0 8px var(--phos-glow);
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      0%, 49%   { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>
</head>

<body>
  <div class="crt">
    <div class="screen" id="termOut"></div>
    <div class="telescan"></div>
  </div>

  <script>
  (function () {
    'use strict';

    /* =====================================================================
       ATLANTIS TERMLINK — onboarding.

       Three acts, because a story is easier to follow than a boot log:

         1. a shell, logged in as dr_boom_boom, who runs ./portal
         2. the binary loading -- segment maps, progress bars, a spinner
         3. the program clearing the screen and taking over with the
            instructions, the way a real terminal program would

       Act 3 clearing the screen is the point of the structure: it turns the
       instructions into a program's interface rather than one more line of log
       output, so they read as the thing you are meant to act on.

       No hand tracking here -- reaching this scene already required a
       confident hand to leave idle. When the sequence ends it posts
       `transition_to_active`, which the parent listens for. If nobody is
       actually there, ModeManager's 45s idle timer takes over.

       NB: the element and variable are deliberately not called `screen`.
       window.screen exists, and an element id also gets named access on
       window, so a top-level const of that name can be a SyntaxError that
       kills the whole file with nothing rendered and no visible error.
       ===================================================================== */

    const out = document.getElementById('termOut');
    const PROMPT = 'dr_boom_boom@atlantis';
    const BIN = 'hippie-trap';

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    let cursor = null;
    function putCursor(el) {
      if (cursor) cursor.remove();
      cursor = document.createElement('span');
      cursor.className = 'cursor';
      el.appendChild(cursor);
    }
    function dropCursor() {
      if (cursor) { cursor.remove(); cursor = null; }
    }

    function addLine(cls) {
      const el = document.createElement('div');
      el.className = 'line ' + (cls || '');
      out.appendChild(el);
      // Bounded: the kiosk runs for days and this replays for every visitor.
      while (out.children.length > 30) out.removeChild(out.firstChild);
      return el;
    }

    function spacer() { addLine('spacer'); }
    function raw(text, cls) { addLine(cls).textContent = text; }

    // Machine output: fast and even.
    async function type(text, cls, cps = 7, hold = 90) {
      const el = addLine(cls);
      for (let i = 0; i < text.length; i += cps) {
        el.textContent = text.slice(0, i + cps);
        putCursor(el);
        await sleep(26);
      }
      el.textContent = text;
      putCursor(el);
      await sleep(hold);
    }

    // A person typing at a prompt: slower, uneven, with a beat before Enter.
    async function command(cmd) {
      const el = addLine('bright');
      const label = PROMPT + ' ~ % ';
      el.textContent = label;
      putCursor(el);
      await sleep(420);
      for (let i = 0; i < cmd.length; i++) {
        el.textContent = label + cmd.slice(0, i + 1);
        putCursor(el);
        // Uneven cadence reads as hands rather than a loop.
        await sleep(52 + Math.random() * 68);
      }
      await sleep(430);
    }

    // Filling progress bar. The label is padded so bars line up in a column.
    // Padding and bar width are chosen so the longest line stays under ~80
    // characters. At 1080p on a 140" screen with 6vw padding only about 80
    // monospace characters fit; a wrapped progress bar looks broken.
    async function bar(label, addr, ms = 560, width = 16) {
      const el = addLine();
      const pad = label.padEnd(20, ' ');
      for (let i = 0; i <= width; i++) {
        const pct = String(Math.round((i / width) * 100)).padStart(3, ' ');
        el.textContent = `[${BIN}] ${pad}${addr}  ${'█'.repeat(i)}${'░'.repeat(width - i)} ${pct}%`;
        await sleep(ms / width);
      }
    }

    // Spinner resolving to OK, for work without a measurable size.
    async function spin(label, ms = 640) {
      const frames = ['⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏'];
      const el = addLine();
      const pad = label.padEnd(32, '.');
      const t0 = Date.now();
      let i = 0;
      while (Date.now() - t0 < ms) {
        el.textContent = `[${BIN}] ${pad} ${frames[i++ % frames.length]}`;
        await sleep(70);
      }
      el.textContent = `[${BIN}] ${pad} OK`;
      await sleep(90);
    }

    async function actShell() {
      raw('ATLANTIS TERMLINK  ·  bash 4.20.69', 'dim');
      raw('Last login: Sun Aug  3 04:20 on ttys000', 'dim');
      spacer();
      await sleep(340);

      await command('ls');
      raw('hippie-trap   looking-glass.dev   scenes/   README.dust', 'dim');
      spacer();
      await sleep(240);

      await command('./hippie-trap --fullscreen');
    }

    async function actLoad() {
      spacer();
      await spin('verifying signature', 480);
      await bar('mapping .text', '0x0000_1000', 480);
      await bar('mapping .shaders', '0x0004_a800', 480);
      await spin('opening looking glass /dev/eye0', 560);
      await spin('calibrating landmark model', 700);
      await type(`[${BIN}] hippie trap armed`, 'amber', 9, 460);
    }

    async function actProgram() {
      // The binary takes the terminal. Clearing is what turns the instructions
      // into a program's interface rather than more log output.
      dropCursor();
      await sleep(320);
      out.textContent = '';
      out.classList.add('app');
      await sleep(220);

      raw('HIPPIE TRAP', 'title');
      raw('CAMP ATLANTIS   ·   4:30 & B PORTAL', 'subtitle');
      await sleep(900);

      // The instruction. Everything else on this screen exists to frame it.
      addLine('hero').textContent = 'RAISE YOUR PALM';
      await sleep(1000);

      // Cinematic rather than a manual: one idea a line, fading in on a beat,
      // written to be understood at a glance from across a dark camp. The
      // audience is standing at the camera looking at a 140" screen, not
      // reading a README.
      const beats = [
        'the looking glass is watching',
        'move — and it moves with you',
        'every thirty seconds it takes you somewhere new',
      ];
      for (const b of beats) {
        addLine('beat').textContent = b;
        await sleep(1050);
      }

      await sleep(700);
    }

    async function run() {
      try {
        await actShell();
        await actLoad();
        await actProgram();
      } catch (err) {
        console.error('[termlink] sequence failed:', err);
      } finally {
        dropCursor();
        // Hand over regardless of what happened above; never leave the
        // installation parked on the onboarding screen.
        try {
          window.parent.postMessage({ type: 'transition_to_active' }, '*');
        } catch (err) {
          console.error('[termlink] could not signal the parent frame:', err);
        }
      }
    }

    run();
  })();
  </script>
</body>

</html>
