<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLANTIS TERMLINK</title>
  <script src="/static/socket.io.js"></script>
  <style>
    @import url('/static/fonts/fonts.css');

    :root {
      --phos: #33ff66;
      --phos-dim: #1a8a3a;
      --phos-glow: rgba(51, 255, 102, 0.55);
      --amber: rgb(255, 176, 66);
      --amber-glow: rgba(255, 176, 66, 0.55);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030c06;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      color: var(--phos);
    }

    /* CRT enclosure. */
    .crt {
      position: absolute;
      inset: 0;
      padding: 5vh 6vw;
      background:
        radial-gradient(ellipse at center, rgba(12, 46, 24, 0.5) 0%, rgba(0, 0, 0, 0.92) 125%),
        #030c06;
      box-shadow: inset 0 0 20vh rgba(0, 0, 0, 0.95);
      text-shadow: 0 0 6px var(--phos-glow);
      /* Sized for a 140" projection. At 1080p a 1vw line is ~1.2 inches tall
         on that screen, so the shell/loader text sits around 2 inches -- big
         enough to read as texture from across a camp, small enough that a
         dozen lines still fit. The instruction panel scales up much further
         below; it is the only part anyone has to actually read. */
      font-size: clamp(18px, 1.9vw, 38px);
      line-height: 1.45;
      letter-spacing: 0.03em;
    }

    /* Scanlines, as the original welcome screen had them: a faint GREEN tint
       on a 4px pitch, not black bars. Mine were rgba(0,0,0,0.30) -- ten times
       darker -- which reads as a dirty screen and moires badly once projected.
       A phosphor tint is what sells a CRT; darkness just costs brightness. */
    .crt::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 50%, rgba(51, 255, 102, 0.035) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 3;
    }

    /* Phosphor shimmer. The original ran this at 0.15s alternating between
       0.98 and 1.0 -- fast and tiny enough to be felt rather than seen. That is
       the whole trick: a slow, large opacity change (mine was 5s down to 0.85)
       reads as the projector faulting, while a fast, 2% one reads as a tube
       that is alive. */
    .shimmer {
      position: absolute;
      inset: 0;
      background: rgba(51, 255, 102, 0.02);
      pointer-events: none;
      z-index: 4;
      animation: shimmer 0.15s infinite linear alternate;
    }

    @keyframes shimmer {
      0%   { opacity: 0.98; }
      100% { opacity: 1; }
    }

    .screen {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;   /* shell output grows upward */
      overflow: hidden;
      /* No flicker animation on the content itself. The shimmer layer handles
         it, at a speed and depth that reads as phosphor rather than as a
         fault. */
    }

    /* Once the binary takes over it owns the screen. Centred and much larger:
       at this point the audience is being asked to do something, from a
       distance, probably in the dark, probably not concentrating. */
    .screen.app {
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 1.5em;
      /* Clear of the corner brackets (inset 3vh/3.5vw plus their 3.2vw arms)
         and of the telemetry strip along the bottom, so nothing can collide
         with the chrome if a line runs long. */
      padding: 8vh 11vw 12vh 11vw;
    }

    /* Share Tech Mono has no U+2588/U+2591. Menlo and SF Mono do, so the
       loader lines switch to a block-capable local font -- applied to the whole
       line, so one consistent set of metrics keeps the bar aligned. */
    .blocks { font-family: 'Menlo', 'SF Mono', 'Monaco', monospace; }

    /* The calibration meter lives on the program screen, where .screen.app
       raises font-size to 1.5em. At the loader's size it measured 1544px
       against a 1267px content box, i.e. it wrapped. Sized down to sit with the
       telemetry row rather than with the headline. */
    .cal {
      font-size: 0.6em;
      letter-spacing: 0.14em;
      color: var(--phos-dim);
      margin-top: 0.4em;
    }

    /* The reassurance line. Kept dim and faded in rather than printed, so it
       reads as the terminal admitting a deadline rather than as an instruction
       competing with the one above it. Reserved in the layout from the start so
       appearing costs no reflow of the centred column. */
    .wait {
      opacity: 0;
      transition: opacity 1.2s ease;
      color: var(--phos-dim);
      font-size: 0.52em;
      letter-spacing: 0.22em;
      margin-top: 0.9em;
      min-height: 1.4em;
    }
    .wait.on { opacity: 0.5; }

    /* Braille exists in exactly one place on this machine: Apple Braille.
       Scoped to the spinner glyph only, which is the last thing on its line, so
       a different advance width cannot shift anything to its right. */
    .spin { font-family: 'Apple Braille', 'Menlo', monospace; }

    .line { white-space: pre-wrap; }

    /* First principle here is that nothing scrolls -- there is no scrollbar on a
       projector and nobody to drag one, so anything that does not fit is simply
       gone. On the program screen lines must not wrap either, because a wrapped
       line is how the overflow starts. nowrap also makes overflow measurable:
       with wrapping on, scrollWidth never exceeds the box and fitViewport would
       have nothing to detect. */
    .screen.app .line { white-space: nowrap; }
    .dim { color: var(--phos-dim); }
    .amber { color: var(--amber); text-shadow: 0 0 8px var(--amber-glow); }
    .bright { color: #b6ffcf; text-shadow: 0 0 10px var(--phos-glow); }
    .spacer { height: 0.75em; }

    /* CSS border rather than box-drawing characters: fixed-width ASCII art
       wraps and falls apart the moment the type gets big or the projector is
       an odd aspect. */
    /* Block-letter address. letter-spacing MUST be 0 and line-height ~1, or
       the glyph columns shear apart -- .crt sets 0.03em tracking for prose,
       which is fatal to monospace art. Sized so the widest string (51 chars)
       clears 1690px of usable width at 1080p, and so six rows plus everything
       below still fits 972px of usable height. */
    /* Set as type rather than block art. The art needed characters the font
       does not have, and once it was rebuilt in plain ASCII it read as ASCII
       art rather than as an address. Large tracked type is cleaner and scales
       properly to the projector. */
    .addr {
      color: var(--amber);
      text-shadow: 0 0 22px var(--amber-glow);
      /* Measured, not guessed: the content box is 1267x756 at 1080p once the
         .crt and .screen.app padding is taken off. Everything below is sized so
         no line wraps and the centred column does not overflow into the chrome. */
      font-size: 2.2em;
      letter-spacing: 0.20em;
      line-height: 1.1;
    }

    .subtitle {
      color: var(--phos);
      font-size: 0.9em;
      letter-spacing: 0.24em;
      margin-top: 0.2em;
      padding-bottom: 0.45em;
      border-bottom: 2px solid var(--phos-dim);
    }


    /* One idea per line, generous spacing, nothing to parse. */
    .beat {
      color: var(--phos);
      font-size: 0.9em;
      letter-spacing: 0.08em;
      margin-top: 0.5em;
      opacity: 0;
      animation: fadein 0.7s ease forwards;
    }

    .beat .q { color: var(--phos-dim); }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(0.35em); }
      to   { opacity: 1; transform: none; }
    }

    /* The one instruction that has to survive being read at a glance. */
    /* Swapped between instructions rather than replaced, so only one is ever on
       screen. Fades through nothing so the words never cross-read. */
    .hero.swap { opacity: 0; }

    .hero {
      transition: opacity 0.42s ease;
      margin: 0.85em 0 0.35em 0;
      padding: 0.5em 1.1em;
      border: 3px solid var(--amber);
      color: var(--amber);
      font-size: 1.5em;
      letter-spacing: 0.12em;
      line-height: 1.2;
      text-shadow: 0 0 10px var(--amber-glow);
      box-shadow: 0 0 20px rgba(255, 176, 66, 0.32),
                  inset 0 0 16px rgba(255, 176, 66, 0.1);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.52; }
    }

    /* ---------------------------------------------------------------- chrome
       Instrument-panel furniture for the program: registration brackets at the
       corners and a telemetry strip along the bottom. Positioned absolutely
       rather than in the flow, so it costs nothing from the vertical budget the
       address and instruction are competing for. Hidden until the binary takes
       the screen. */
    .chrome {
      position: absolute;
      inset: 3vh 3.5vw;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
      z-index: 2;
    }

    .chrome.on { opacity: 1; }

    /* Live hand cursor -- a Pip-Boy style palm, not a reticle. The audience is
       being told to raise a palm, so the thing that echoes their movement should
       be a palm. Solid fill rather than outlines: the silhouette is built from
       overlapping shapes, and any stroke would draw the seams between them.
       Driven by transform so following a hand costs no layout work. */
    .reticle {
      position: absolute;
      left: 0; top: 0;
      /* 72x92 viewBox, so height leads and width follows the ratio. Margins put
         the palm centre of the drawing on the tracked point. */
      width: 7.04vh;
      height: 9vh;
      margin: -5.76vh 0 0 -3.73vh;
      opacity: 0;
      transition: opacity 0.45s ease, filter 0.4s ease;
      pointer-events: none;
      z-index: 3;
      filter: drop-shadow(0 0 12px var(--phos-glow));
    }
    .reticle svg { display: block; width: 100%; height: 100%; }
    .reticle .hand { fill: var(--phos); transition: fill 0.4s ease; }

    /* Held just under full so it reads as phosphor rather than paint. Opacity
       lives on the container, never on the shapes, or the overlaps show. */
    .reticle.on { opacity: 0.92; }

    .reticle.locked { filter: drop-shadow(0 0 18px var(--amber-glow)); }
    .reticle.locked .hand { fill: var(--amber); }

    /* The four corner marks only. This was `.chrome i`, which also caught the
       <i class="dot"> status indicators nested inside the telemetry row --
       absolutely positioning them and stretching them to 3.2vw x 3.2vh, which
       with border-radius 50% is a 61x35 oval. Keep it scoped to the class. */
    .chrome i.corner {
      position: absolute;
      width: 3.2vw;
      height: 3.2vh;
      border: 2px solid var(--phos-dim);
    }
    .chrome i.corner.tl { top: 0;    left: 0;    border-right: 0; border-bottom: 0; }
    .chrome i.corner.tr { top: 0;    right: 0;   border-left: 0;  border-bottom: 0; }
    .chrome i.corner.bl { bottom: 0; left: 0;    border-right: 0; border-top: 0; }
    .chrome i.corner.br { bottom: 0; right: 0;   border-left: 0;  border-top: 0; }

    .telemetry {
      position: absolute;
      /* Inset past the corner marks (3.2vw each) plus breathing room, so the
         row runs between the brackets rather than across them. */
      left: 4.6vw; right: 4.6vw; bottom: -0.2vh;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.62em;
      letter-spacing: 0.16em;
      color: var(--phos-dim);
    }

    .telemetry .grp { display: flex; gap: 1.6em; }

    /* Status lamps on deliberately unrelated periods, so the panel reads as
       several independent subsystems rather than one blinking thing. */
    .stat { display: inline-flex; align-items: center; }

    /* Same shape as .status-indicator in static/index.html: a drawn dot with a
       glow and a slow pulse. Drawn rather than typed because U+25CF is not in
       the font and a fallback would sit on its own baseline. */
    /* Square, guaranteed. These were rendering as ovals: as a flex item the
       cross-axis size was being resolved from the line box rather than from the
       height property. `flex: none` plus an explicit aspect-ratio pins it. */
    .dot {
      display: inline-block;
      width: 0.6em;
      height: 0.6em;
      aspect-ratio: 1 / 1;
      flex: none;
      align-self: center;
      box-sizing: border-box;
      margin-right: 0.6em;
      border-radius: 50%;
      background: var(--phos-dim);
      box-shadow: 0 0 6px rgba(51, 255, 102, 0.35);
      animation: dot-pulse 2.4s ease-in-out infinite;
    }

    .dot.ready {
      background: var(--phos);
      box-shadow: 0 0 12px var(--phos-glow);
      animation: dot-ready 1.6s ease-in-out infinite;
    }

    /* Error: nothing being tracked. Amber, faster, and the label goes with it. */
    .dot.error {
      background: var(--amber);
      box-shadow: 0 0 14px var(--amber-glow);
      animation: dot-error 0.75s steps(1) infinite;
    }

    .stat.error { color: var(--amber); text-shadow: 0 0 8px var(--amber-glow); }

    @keyframes dot-pulse  { 0%,100% { opacity: 0.45; } 50% { opacity: 0.9; } }
    @keyframes dot-ready  { 0%,100% { opacity: 1; }    50% { opacity: 0.55; } }
    @keyframes dot-error  { 0%,49%  { opacity: 1; }    50%,100% { opacity: 0.15; } }

    /* Signal bars, climbing and holding. */
    .bars { display: inline-flex; align-items: flex-end; gap: 0.14em; height: 1em; }
    .bars b {
      display: block;
      width: 0.22em;
      background: var(--phos);
      box-shadow: 0 0 6px var(--phos-glow);
    }
    /* Signal 2-3 of 4. Bars one and two are always lit, the third comes and
       goes on a randomised interval, the fourth never reaches. Previously the
       first two were never given .lit at all, so the meter showed one bar or
       none -- which is why it looked wrong. Transition is slow and the dim state
       is not very dim, so the change is subtle rather than a blink. */
    .bars b { background: var(--phos-dim); opacity: 0.3; transition: opacity 0.6s ease, background 0.6s ease; }
    .bars b.lit { background: var(--phos); opacity: 1; }
    .bars b:nth-child(1) { height: 30%; }
    .bars b:nth-child(2) { height: 55%; }
    .bars b:nth-child(3) { height: 78%; }
    .bars b:nth-child(4) { height: 100%; }

    .cursor {
      display: inline-block;
      width: 0.58em;
      height: 1.02em;
      margin-left: 0.08em;
      vertical-align: text-bottom;
      background: var(--phos);
      box-shadow: 0 0 8px var(--phos-glow);
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      0%, 49%   { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>
</head>

<body>
  <div class="crt">
    <div class="screen" id="termOut"></div>

    <!-- Instrument chrome. Revealed when the binary takes the screen. -->
    <div class="chrome" id="chrome">
      <i class="corner tl"></i><i class="corner tr"></i>
      <i class="corner bl"></i><i class="corner br"></i>
      <div class="telemetry">
        <div class="grp">
          <span class="stat" id="linkStat">
            <i class="dot ready"></i>LINK /dev/eye0
          </span>
          <span class="stat" id="trackStat">
            <i class="dot"></i><span id="trackText">TRACK --</span>
          </span>
        </div>
        <div class="grp">
          <span>NODE BRC-430B</span>
          <span>hippie-trap 4.20.69</span>
          <span class="bars"><b></b><b></b><b></b><b></b></span>
        </div>
      </div>
    </div>

    <!-- Hand cursor. Revealed during calibration, hidden again on hand-off.
         An open palm assembled from rounded primitives -- deliberately blocky,
         which suits the era and stays legible at 140 inches. -->
    <div class="reticle" id="reticle">
      <svg viewBox="0 0 72 92" aria-hidden="true" focusable="false">
        <g class="hand">
          <rect x="20" y="14" width="9" height="34" rx="4.5"/>
          <rect x="31" y="8"  width="9" height="40" rx="4.5"/>
          <rect x="42" y="13" width="9" height="35" rx="4.5"/>
          <rect x="53" y="22" width="8" height="26" rx="4"/>
          <rect x="16" y="40" width="45" height="38" rx="9"/>
          <rect x="3"  y="42" width="9"  height="28" rx="4.5"
                transform="rotate(-28 7.5 56)"/>
        </g>
      </svg>
    </div>

    <div class="shimmer"></div>
  </div>

  <script>
  (function () {
    'use strict';

    /* =====================================================================
       ATLANTIS TERMLINK — onboarding.

       Three acts, because a story is easier to follow than a boot log:

         1. a shell, logged in as dr_boom_boom, who runs ./hippie-trap
         2. the binary loading -- segment maps, progress bars, spinners
         3. the program clearing the screen and taking over with the
            instructions, the way a real terminal program would
         4. calibration -- a ring that follows the hand, which the audience
            has to move before the portal opens

       Act 3 clearing the screen is the point of the structure: it turns the
       instructions into a program's interface rather than one more line of log
       output, so they read as the thing you are meant to act on.

       Act 4 is the one that does the actual onboarding. Acts 1-3 are watched;
       act 4 is done, and using the control is the only way it gets learned. It
       talks to the tracker over its own socket, so the hands it sees are
       unfiltered by the parent's confidence gate -- a tentative first wave should
       still move the cursor. The telemetry count is the opposite: filtered at 0.7
       and settled over 600ms, because a number a person reads should not flicker
       even when the raw signal does.

       The parent HUD is deliberately hidden for this scene (HUDManager
       showForMode), because this screen brings its own chrome and the scene bar
       on top of it reads as two interfaces fighting.

       When the sequence ends it posts `transition_to_active`, which the parent
       listens for. Every wait in act 4 is bounded -- no hand, hand then absent,
       or no camera at all each give up and hand over -- but a present palm is
       never overridden by a timer. The dim countdown says how much longer to
       hold, and only mentions a missing palm after a couple of seconds of
       nothing, so it reaches whoever might feel stuck and nobody else. If nobody is actually
       there, ModeManager's 45s idle timer takes over as well.

       NB: the element and variable are deliberately not called `screen`.
       window.screen exists, and an element id also gets named access on
       window, so a top-level const of that name can be a SyntaxError that
       kills the whole file with nothing rendered and no visible error.
       ===================================================================== */

    const out = document.getElementById('termOut');
    const PROMPT = 'dr_boom_boom@atlantis';
    const BIN = 'hippie-trap';

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    let cursor = null;
    function putCursor(el) {
      if (cursor) cursor.remove();
      cursor = document.createElement('span');
      cursor.className = 'cursor';
      el.appendChild(cursor);
    }
    function dropCursor() {
      if (cursor) { cursor.remove(); cursor = null; }
    }

    function addLine(cls) {
      const el = document.createElement('div');
      el.className = 'line ' + (cls || '');
      out.appendChild(el);
      // Bounded: the kiosk runs for days and this replays for every visitor.
      while (out.children.length > 30) out.removeChild(out.firstChild);
      // Only the program screen is centred and size-critical; the shell scrolls
      // its own output upward by design and does not need refitting per line.
      if (out.classList.contains('app')) fitViewport();
      return el;
    }

    // Nothing scrolls, so nothing may overflow -- shrink the type until the whole
    // column fits the box in both directions.
    //
    // This exists because hand-measured type sizes are guesswork. Estimating
    // character advances is how lines ended up wrapping and how the column ended
    // up 73px too tall for its box; the browser knows the real answer, so ask it.
    //
    // Measured from the children's own rects rather than scrollHeight: the
    // program screen is a centred flex column, and centred overflow spills out of
    // both ends at once, which leaves scrollHeight equal to clientHeight and the
    // overflow undetected.
    function fitViewport() {
      const kids = Array.from(out.children);
      if (!kids.length) return;

      const cs = getComputedStyle(out);
      const availH = out.clientHeight
        - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      const availW = out.clientWidth
        - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);

      let size = 1.5;   // the .screen.app default; recomputed from scratch each call
      out.style.fontSize = size + 'em';

      // Floor at 0.75em: past that the instruction stops being readable across a
      // dark camp, and a too-small line is a worse failure than a clipped one.
      while (size > 0.75) {
        const h = kids[kids.length - 1].getBoundingClientRect().bottom
                - kids[0].getBoundingClientRect().top;
        let w = 0;
        for (const k of kids) w = Math.max(w, k.scrollWidth);
        if (h <= availH && w <= availW) return;
        size -= 0.05;
        out.style.fontSize = size + 'em';
      }
    }

    function spacer() { addLine('spacer'); }
    function raw(text, cls) { addLine(cls).textContent = text; }

    // Machine output: fast and even.
    async function type(text, cls, cps = 7, hold = 90) {
      const el = addLine(cls);
      for (let i = 0; i < text.length; i += cps) {
        el.textContent = text.slice(0, i + cps);
        putCursor(el);
        await sleep(26);
      }
      el.textContent = text;
      putCursor(el);
      await sleep(hold);
    }

    // A person typing at a prompt: slower, uneven, with a beat before Enter.
    async function command(cmd) {
      const el = addLine('bright');
      const label = PROMPT + ' ~ % ';
      el.textContent = label;
      putCursor(el);
      await sleep(420);
      for (let i = 0; i < cmd.length; i++) {
        el.textContent = label + cmd.slice(0, i + 1);
        putCursor(el);
        // Uneven cadence reads as hands rather than a loop.
        await sleep(52 + Math.random() * 68);
      }
      await sleep(430);
    }

    // Filling progress bar. The label is padded so bars line up in a column.
    // Padding and bar width are chosen so the longest line stays under ~80
    // characters. At 1080p on a 140" screen with 6vw padding only about 80
    // monospace characters fit; a wrapped progress bar looks broken.
    async function bar(label, addr, ms = 560, width = 16) {
      const el = addLine('blocks');
      const pad = label.padEnd(20, ' ');
      for (let i = 0; i <= width; i++) {
        const pct = String(Math.round((i / width) * 100)).padStart(3, ' ');
        el.textContent = `[${BIN}] ${pad}${addr}  ${'\u2588'.repeat(i)}${'\u2591'.repeat(width - i)} ${pct}%`;
        await sleep(ms / width);
      }
    }

    // Spinner resolving to OK, for work without a measurable size.
    async function spin(label, ms = 640) {
      const frames = ['\u280B','\u2819','\u2839','\u2838','\u283C','\u2834','\u2826','\u2827','\u2807','\u280F'];
      const el = addLine();
      const pad = label.padEnd(32, '.');
      // The spinner glyph gets its own element so only it uses the braille
      // font; the surrounding text stays in Share Tech Mono.
      const head = document.createTextNode(`[${BIN}] ${pad} `);
      const mark = document.createElement('span');
      mark.className = 'spin';
      el.appendChild(head);
      el.appendChild(mark);

      const t0 = Date.now();
      let i = 0;
      while (Date.now() - t0 < ms) {
        mark.textContent = frames[i++ % frames.length];
        await sleep(70);
      }
      mark.className = '';
      mark.textContent = 'OK';
      await sleep(90);
    }

    async function actShell() {
      raw('ATLANTIS TERMLINK  ·  bash 4.20.69', 'dim');
      raw('Last login: Sun Aug  3 04:20 on ttys000', 'dim');
      spacer();
      await sleep(900);

      await command('ls');
      raw('hippie-trap   looking-glass.dev   scenes/   README.dust', 'dim');
      spacer();
      await sleep(520);

      await command('./hippie-trap --fullscreen');
    }

    async function actLoad() {
      spacer();
      // The sequence needs somewhere to breathe -- people are still walking up
      // at this point. It used to breathe in the shell, on a `cat README.dust`
      // nobody at the back of a dark camp could read. Here the same three
      // seconds read as the binary itself being heavy to load.
      await bar('loading ' + BIN, '0x0000_0000', 3000, 24);
      await spin('verifying signature', 520);
      await bar('mapping .text', '0x0000_1000', 520);
      await bar('mapping .rodata', '0x0002_c000', 460);
      await bar('mapping .shaders', '0x0004_a800', 560);
      await spin('seeding entropy from dust', 520);
      await spin('opening looking glass /dev/eye0', 640);
      await spin('calibrating landmark model', 780);
      await bar('loading scene table', '0x0011_0000', 620);
      await spin('warming frame buffer', 560);
      await type(`[${BIN}] hippie trap armed`, 'amber', 9, 520);
    }

    async function actProgram(sensor) {
      // The binary takes the terminal. Clearing is what turns the instructions
      // into a program's interface rather than more log output.
      dropCursor();
      await sleep(320);
      out.textContent = '';
      out.classList.add('app');
      document.getElementById('chrome').classList.add('on');
      meterLoop();
      trackTelemetry(sensor);
      await sleep(220);

      // The address in block letters is the anchor now. The program name is
      // not repeated here -- it just went past in the loader, and the vertical
      // space is better spent on the address and the instruction.
      raw('4:30 & B', 'addr');
      raw('PORTAL  ·  CAMP ATLANTIS', 'subtitle');
      await sleep(1500);

      // The instruction. Everything else on this screen exists to frame it.
      const heroEl = addLine('hero');
      heroEl.textContent = 'RAISE YOUR PALM';
      await sleep(1400);

      // Cinematic rather than a manual: one idea a line, fading in on a beat,
      // written to be understood at a glance from across a dark camp. The
      // audience is standing at the camera looking at a 140" screen, not
      // reading a README.
      const beats = [
        'the looking glass is watching',
        'move — and it moves with you',
        'somewhere new every 30 seconds',
      ];
      // Handed back with the hero, so the calibration act can clear the beats and
      // rewrite the instruction in place. The screen has room for the address,
      // one instruction and the meter -- not for all of it at once.
      const beatEls = [];
      for (const b of beats) {
        const el = addLine('beat');
        el.textContent = b;
        beatEls.push(el);
        await sleep(1300);
      }

      await sleep(1100);
      return { beatEls, heroEl };
    }

    // ---------------------------------------------------------- telemetry
    // The meter and the hand count are the only live things on this screen.
    // Everything else is scripted, so these are what make it read as an
    // instrument rather than a slideshow.

    // Third bar toggles on irregular intervals. A fixed period reads as an
    // animation; an uneven one reads as a fluctuating signal.
    function meterLoop() {
      const bars = document.querySelectorAll('.bars b');
      if (bars.length < 4) return;

      // Bars one and two stay lit; that is the floor. This was the bug -- they
      // were never given .lit, so the meter read one bar or none instead of the
      // two-or-three it was supposed to.
      bars[0].classList.add('lit');
      bars[1].classList.add('lit');

      // Third comes and goes on an uneven interval, so the total sits at 2 or 3.
      // Held longer lit than dropped, so 3 is the resting state and 2 is the dip.
      const third = bars[2];
      third.classList.add('lit');
      const step = () => {
        const lit = third.classList.toggle('lit');
        setTimeout(step, lit ? 2200 + Math.random() * 3000
                             : 900 + Math.random() * 1600);
      };
      setTimeout(step, 2500 + Math.random() * 2000);
    }

    // hand_moved / hand_detected both carry `hands` as a list, each entry with
    // palm_center, wrist, landmarks and confidence. Highest confidence wins so the
    // cursor does not flip between two hands mid-hold.
    function pickHand(d) {
      const hands = (d && d.hands) || [];
      if (!hands.length) return null;
      let best = hands[0];
      for (const h of hands) {
        const c = (h.confidence && h.confidence.overall) || 0;
        const b = (best.confidence && best.confidence.overall) || 0;
        if (c > b) best = h;
      }
      return best;
    }

    // One socket for the whole page. The telemetry row and the hand cursor both
    // want tracker events, and a second connection would double per-frame
    // delivery to no end. Note the event key is `type`, not `event_type`.
    //
    // This page talks to the tracker directly rather than through the parent, so
    // the hands here are unfiltered -- the parent's confidence >= 0.7 gate does
    // not apply. That is what we want while teaching the control: a tentative
    // first wave should still move the ring.
    function connectSensor() {
      const frameFns = [];
      const handFns = [];
      let socket = null;

      try {
        socket = io();
      } catch (err) {
        console.error('[termlink] socket unavailable:', err);
      }

      if (socket) {
        socket.on('connect', () => {
          socket.emit('subscribe', {
            events: ['frame_processed', 'hand_moved', 'hand_detected'],
          });
        });
        socket.on('event', (event) => {
          if (!event) return;
          if (event.type === 'frame_processed') {
            for (const fn of frameFns) fn(event.data || {});
          } else if (event.type === 'hand_moved' || event.type === 'hand_detected') {
            for (const fn of handFns) fn(event.data || {});
          }
        });
      }

      return {
        onFrame(fn) { frameFns.push(fn); },
        onHand(fn) { handFns.push(fn); },
      };
    }

    // Real hand count off the tracker's heartbeat, which carries hand_count.
    function trackTelemetry(sensor) {
      const dot = document.querySelector('#trackStat .dot');
      const label = document.getElementById('trackText');
      const stat = document.getElementById('trackStat');
      if (!dot || !label || !stat) return;

      // The label is read by a person, so it is allowed to lag the data. A count
      // that flickers 1/2/1 within a few frames is noise, and printing it makes
      // the instrument look unreliable even when tracking is fine.
      //
      // Note this is a display concern only, deliberately not pushed into the
      // tracker: settling the count upstream would delay every scene's reaction to
      // a real hand by the same window, and the scenes want the raw signal.
      const CONF_MIN = 0.7;       // same gate the parent applies before scenes see hands
      const SETTLE_MS = 600;      // a changed count must hold this long to be shown
      const HAND_GAP_MS = 500;    // no hand event for this long means zero hands

      const started = Date.now();
      let lastSeen = 0;
      let lastHandAt = 0;
      let rawConfident = 0;   // hands the parent would also accept
      let rawPresent = 0;     // hands the tracker reports at all
      let shownKey = null;
      let candidate = null;
      let candidateAt = 0;

      // Three distinct states, because they mean different things to whoever is
      // standing there: hands absent, sensor gone quiet, sensor never came up.
      function set(text, ok) {
        label.textContent = text;
        dot.className = ok ? 'dot ready' : 'dot error';
        stat.classList.toggle('error', !ok);
      }

      // Four states rather than three. ACQUIRING is the one that stops the strip
      // contradicting the rest of the screen: the palm-lock gate accepts any hand
      // the tracker reports, so without it the gauge could be filling while this
      // said NO HANDS DETECTED. Now "something is there but not resolved" has its
      // own words instead of being rounded to nothing.
      function show(key, n) {
        if (key === 'count') set(`TRACK ${n} HAND${n === 1 ? '' : 'S'}`, true);
        else if (key === 'acquiring') set('ACQUIRING', true);
        else set('NO HANDS DETECTED', false);
      }
      set('TRACK --', false);

      // Liveness comes off the heartbeat; the count does not. frame_processed
      // carries hand_count but no confidence, and an unfiltered count is exactly
      // what was reporting two hands on one.
      sensor.onFrame(() => { lastSeen = Date.now(); });

      sensor.onHand((d) => {
        const hands = (d && d.hands) || [];
        rawPresent = hands.length;
        rawConfident = hands.filter(
          (h) => ((h.confidence && h.confidence.overall) || 0) >= CONF_MIN).length;
        lastHandAt = Date.now();
      });

      // hand_moved stops arriving entirely when the hands go, so zero has to be
      // inferred from the gap rather than waited for.
      setInterval(() => {
        const now = Date.now();
        if (!lastSeen || now - lastSeen > 2000) return;   // sensor states win below

        const fresh = (now - lastHandAt) < HAND_GAP_MS;
        const confident = fresh ? rawConfident : 0;
        const present = fresh ? rawPresent : 0;

        // Debounce the whole state, not just the number, so 1 -> ACQUIRING -> 1
        // does not flicker either.
        const key = confident > 0 ? `count:${confident}`
                  : present > 0 ? 'acquiring'
                  : 'none';

        if (key !== candidate) {
          candidate = key;
          candidateAt = now;
        } else if (candidate !== shownKey && now - candidateAt >= SETTLE_MS) {
          shownKey = candidate;
          show(candidate.startsWith('count') ? 'count' : candidate,
               parseInt(candidate.split(':')[1] || '0', 10));
        }
      }, 100);

      // A missing heartbeat is not the same as zero hands. Distinguish never
      // having started from having stopped -- with no camera attached the
      // tracker never emits at all, and reporting "no hands" for that would be
      // misleading about which thing is broken.
      setInterval(() => {
        const now = Date.now();
        if (!lastSeen) {
          if (now - started > 3000) set('SENSOR OFFLINE', false);
        } else if (now - lastSeen > 2000) {
          set('SENSOR STALE', false);
        }
      }, 1000);
    }

    // The act that actually onboards. Everything before it is a story the
    // audience watches; this is the part they do, and doing it is the only way
    // the control gets learned.
    //
    // Fails soft in three directions, because nobody is here to unstick it: the
    // hand never appears, the hand appears and wanders off, or there is no
    // camera at all. Each one gives up and hands over rather than parking the
    // installation on this screen.
    async function actCalibrate(sensor, beatEls, heroEl) {
      // The gate is a sustained palm, not distance travelled. Three seconds of
      // continuous detection is a deliberately demanding ask: it proves the
      // person is standing where the camera can hold them, which is exactly what
      // the rest of the piece needs and what a quick wave does not establish.
      const HOLD_MS = 3000;
      const GRACE_MS = 600;       // a dropped frame or two is not losing the palm
      const WIDTH = 16;
      const SHOW_WAIT_MS = 2500;
      const NO_SENSOR_MS = 4000;  // no heartbeat at all -- do not stall on a dead camera
      // Last resort only, for hands that flicker in and out so badly the hold can
      // never complete. In that state the parent sees hand_detected often enough
      // to keep clearing its idle timer, so nothing else would ever free this
      // screen. Long enough that no ordinary visitor reaches it.
      const STALL_CAP_MS = 90000;

      for (const el of beatEls) el.remove();

      // Rewrite the instruction in place. Adding a second .hero line was leaving
      // both RAISE YOUR PALM and NOW MOVE IT on screen at once, which is what
      // pushed the column past the viewport -- each hero box is 3px of border,
      // 1em of padding and a 1.5em line.
      const prompt = heroEl;
      prompt.classList.add('swap');
      await sleep(420);
      prompt.textContent = 'NOW MOVE IT';
      prompt.classList.remove('swap');
      const meter = addLine('blocks cal');
      const hint = addLine('beat');
      hint.textContent = 'the ring follows your hand';

      // Anyone who raises a hand straight away never sees this. It fades in only
      // once someone has been still long enough to wonder whether they are stuck.
      const wait = addLine('wait');

      const reticle = document.getElementById('reticle');
      let target = null;
      let lastHandAt = 0;
      let sawFrame = false;

      sensor.onFrame(() => { sawFrame = true; });
      sensor.onHand((d) => {
        // hand_moved and hand_detected both carry data.hands as a LIST -- there is
        // no palm_center at the top level. Reading one there is why the gauge sat
        // at zero with a hand plainly detected: every event returned early.
        const hand = pickHand(d);
        if (!hand) return;
        const p = hand.palm_center || hand.wrist;
        if (!p) return;
        // The tracker already mirrors the frame (cv2.flip in hand_tracker), so x
        // maps straight to screen x -- moving right moves the cursor right. Do not
        // mirror again here.
        target = { x: p.x, y: p.y };
        lastHandAt = Date.now();
      });

      // Smoothed follow: one element, one rAF, cancelled on the way out. Raw
      // landmark positions jitter enough to look broken at 140 inches.
      let raf = 0;
      let cx = 0.5, cy = 0.5, shown = false;
      const follow = () => {
        if (target) {
          if (!shown) {
            cx = target.x; cy = target.y; shown = true;
            reticle.classList.add('on');
          }
          cx += (target.x - cx) * 0.22;
          cy += (target.y - cy) * 0.22;
          reticle.style.transform =
            `translate(${cx * window.innerWidth}px, ${cy * window.innerHeight}px)`;
        }
        raf = requestAnimationFrame(follow);
      };
      raf = requestAnimationFrame(follow);

      const t0 = Date.now();
      let learned = false;
      let held = 0;
      let prev = Date.now();
      try {
        for (;;) {
          const now = Date.now();
          const dt = now - prev;
          prev = now;
          const fresh = lastHandAt > 0 && (now - lastHandAt) < GRACE_MS;

          // Continuous is the requirement, so losing the palm past the grace
          // window sends them back to zero rather than pausing the gauge.
          held = fresh ? held + dt : 0;

          const pct = Math.min(1, held / HOLD_MS);
          const fill = Math.round(pct * WIDTH);
          // No [BIN] prefix: that belongs to loader log output, not to the
          // program's own interface.
          meter.textContent = `PALM LOCK  `
            + `${'\u2588'.repeat(fill)}${'\u2591'.repeat(WIDTH - fill)} `
            + `${String(Math.round(pct * 100)).padStart(3, ' ')}%`;
          if (pct >= 1) { learned = true; break; }

          // The countdown is now what they asked for rather than a deadline: how
          // much longer to hold. Only prompts about a missing palm once someone
          // has been standing there long enough to wonder.
          const waited = now - t0;
          if (fresh) {
            wait.textContent = `hold ${Math.max(1, Math.ceil((HOLD_MS - held) / 1000))}s`;
            wait.classList.add('on');
          } else if (waited > SHOW_WAIT_MS) {
            wait.textContent = 'show your palm to the looking glass';
            wait.classList.add('on');
          }

          if (!sawFrame && waited > NO_SENSOR_MS) break;
          if (waited > STALL_CAP_MS) break;
          await sleep(80);
        }

        if (learned) {
          reticle.classList.add('locked');
          prompt.textContent = 'LINKED';
          hint.textContent = 'the portal is yours';
          // Nothing to reassure them about now; they did it.
          wait.classList.remove('on');
          await sleep(1800);
        } else {
          hint.textContent = sawFrame ? 'starting anyway' : 'looking glass offline — starting anyway';
          await sleep(1100);
        }
      } finally {
        cancelAnimationFrame(raf);
        reticle.classList.remove('on');
      }
    }

    async function run() {
      try {
        await actShell();
        await actLoad();
        const sensor = connectSensor();
        const { beatEls, heroEl } = await actProgram(sensor);
        await actCalibrate(sensor, beatEls, heroEl);
      } catch (err) {
        console.error('[termlink] sequence failed:', err);
      } finally {
        dropCursor();
        // Hand over regardless of what happened above; never leave the
        // installation parked on the onboarding screen.
        try {
          window.parent.postMessage({ type: 'transition_to_active' }, '*');
        } catch (err) {
          console.error('[termlink] could not signal the parent frame:', err);
        }
      }
    }

    run();
  })();
  </script>
</body>

</html>
